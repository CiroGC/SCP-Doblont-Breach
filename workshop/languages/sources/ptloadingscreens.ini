[Fundacao SCP]
image path = foundationlogo.jpg
align x = left
align y = top
text1 = A Fundacao SCP e uma organizacao dedicada a contencao e investigacao de artefatos e formas de vida anomalas.
text2 = "SCP" significa "Procedimentos Especiais de Contencao" (e o lema oficial da fundacao, "Assegurar, Conter, Proteger"), que resume os objetivos e os metodos de acao da Fundacao.