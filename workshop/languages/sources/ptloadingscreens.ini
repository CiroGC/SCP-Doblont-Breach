[Mobile Task Forces]
image path = mtf.jpg
align x = center
align y = center
text1 = Os MTFs sao equipes pequenas (normalmente de 10 a 20 agentes, embora existam grupos de mais de 50 agentes) que se especializam em preencher funcoes especificas ou responder a situacoes especificas.
text2 = A Forca Tarefa Movel E-11 ("Nine Tailed Fox") e uma unidade intensamente treinada especializada na protecao e preservacao de itens SCP armazenados no Local. - [DADOS EXPURGADOS].
text3 = Suas tarefas incluem o gerenciamento de brechas de contencao contendo todas as instancias SCP ativas e hostis, resgatando o pessoal sobrevivente da Fundacao e destruindo qualquer pessoal de Classe D desonesto.

[Oculos de Visao Noturna]
image path = NVG.jpg
align x = right
align y = top
disablebackground = true
text1 = Oculos de visao noturna padrao sao emitidos para unidades MTF em caso de falta de energia.
text2 = Os cientistas tambem os recebem, mas sao aconselhados a se concentrar na evacuacao em caso de apagao.

[SCP-012]
image path = 012.jpg
align x = right
align y = top
disablebackground = true
text1 = SCP-012 foi recuperado pelo arqueologo K.M. Sandoval enquanto escavava uma tumba no norte da Italia. O objeto e uma partitura manuscrita intitulada "No Monte Golgota", parece incompleta.
text2 = A tinta vermelha/preta, que inicialmente se acreditava ser algum tipo de berry ou tinta corante natural, mais tarde acabou descoberto de que se tratava de sangue humano de varios individuos.
text3 = Varios sujeitos de teste receberam acesso para escrever. Em todos os casos, os sujeitos se automutilaram para usar seu proprio sangue para completar a peca, resultando em sintomas posteriores de psicose e trauma macico.

[SCP-035]
image path = 035.jpg
align x = right
align y = top
disablebackground = true
text1 = SCP-035 parece ser uma mascara de comedia de porcelana branca, embora as vezes se transforme em uma mascara de tragedia.
text2 = Quando SCP-035 e colocado no rosto de um individuo, outro padrao de ondas cerebrais de SCP-035 se sobrepoe ao do hospedeiro original, extinguindo-o e causando a morte cerebral do individuo. O sujeito entao afirma ser a consciencia contida em SCP-035.
text3 = A analise psicologica descobriu que SCP-035 possui uma natureza altamente manipuladora, capaz de forcar mudancas repentinas e profundas no estado psicologico do entrevistador. SCP-035 provou ser altamente sadico, levando alguns a cometer suicidio apenas com persuasao linguistica.

[SCP-049]
image path = 049.jpg
align x = left
align y = center
disablebackground = true
text1 = SCP-049 tem uma aparencia humanoide; No entanto, a Fundacao e incapaz de estudar seu rosto e corpo com mais detalhes, pois ele esta coberto pelo que parece ser o traje de um tradicional medico europeu da peste dos seculos XV e XVI.
text2 = O toque de SCP-049 e invariavelmente letal para humanos. Ao entrar em contato com a(s) mao(s) de SCP-049, a vitima (doravante referida como SCP-049-2) sofre [DADOS EXPURGADOS] e morre em instantes.
text3 = SCP-049 entao puxa uma bolsa [DADOS EXPURGADOS] contendo bisturis, uma agulha, linha e varios frascos de uma substancia ainda nao identificada, e comeca a dissecar SCP-049-2, bem como a introduzir varios produtos quimicos no corpo.
text4 = Apos aproximadamente 20 minutos, SCP-049 costurara SCP-049-2 e ficara docil novamente. Apos alguns minutos, SCP-049-2 recuperara seus sinais vitais e parecera reviver.

[SCP-066]
image path = 066.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-066 e uma massa amorfa de fio finamente torcido pesando aproximadamente um quilo.
text2 = Apos o Incidente 066-2 (veja o Relatorio de Incidente 066-2), SCP-066 comecou a apresentar um comportamento altamente inconsistente com suas propriedades anteriores.
text3 = SCP-066 agora exibe mobilidade significativa e produzira notas e efeitos anomalos na presenca de qualquer humano, esteja ou nao esse humano interagindo com SCP-066.

[SCP-079]
image path = 079.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-079 e um microcomputador Exidy Sorcerer construido em 1978.
text2 = Nao se sabe quando SCP-079 tomou conhecimento, mas sabe-se que o software evoluiu a um ponto em que seu hardware nao deveria ser capaz de lidar com ele, nem mesmo no reino da fantasia.
text3 = Ele passou no teste de Turing e e bastante falante, embora com um tom muito rude e desagradavel. Ele tambem mostra um desejo malevolo de escapar.

[SCP-096]
image path = 096.png
align x = right
align y = bottom
disablebackground = true
text1 = SCP-096 e normalmente muito docil, com sensores de pressao em sua cela indicando que ele passa a maior parte do dia andando pela parede.
text2 = No entanto, quando alguem ve o rosto de SCP-096, seja diretamente, via gravacao de video, ou mesmo uma fotografia, o SCP entra em uma fase de consideravel sofrimento emocional.
text3 = Aproximadamente um a dois minutos apos a primeira visualizacao, SCP-096 comecara a correr em direcao a pessoa que viu seu rosto.

[SCP-106]
image path = 106.jpg
align x = right
align y = bottom
text1 = SCP-106 parece ser um humanoide envelhecido, com uma aparencia geral de decomposicao avancada. Esse aspecto pode variar, mas a qualidade de "podridao" e observada em todas as suas formas.
text2 = SCP-106 causa um efeito de "corrosao" em qualquer material solido que toque, fazendo com que os materiais se rompam fisicamente varios segundos apos o contato. Isso e observado como ferrugem, apodrecimento e rachaduras de materiais, e a criacao de uma substancia preta semelhante ao material que reveste SCP-106.
text3 = SCP-106 pode perfurar materia solida e capturar e matar sua presa arrastando-a para o que se acredita ser sua "dimensao de bolso" pessoal.

[SCP-173]
image path = 173.jpg
align x = left
align y = bottom
text1 = SCP-173 e construido de concreto e vergalhoes com tracos de tinta spray da marca Krylon. Ele esta vivo e e extremamente hostil.
text2 = O objeto nao pode se mover enquanto estiver em uma linha de visao direta. A linha de visao nao deve ser interrompida a qualquer momento com SCP-173. O pessoal responsavel por entrar no conteiner e responsavel por alertarem os outros antes de piscar.

[SCP-205]
image path = 205.jpg
align x = right
align y = bottom
disablebackground = true
text1 = SCP-205 e um par de holofotes usados ??em fotografia. A luz emitida por cada lampada se comporta de forma unica para SCP-205 e passa completamente por qualquer superficie nao branca.
text2 = Se a luz continuar ininterruptamente em qualquer sujeito, sem projetar nenhuma sombra, cada lampada mostrara a sombra de uma jovem nao identificada em qualquer superficie branca plana, como a tela de projecao da camera 52.

[SCP-294]
image path = 294.jpg
align x = center
align y = bottom
disablebackground = true
text1 = O objeto SCP-294 parece ser um dispensador de cafe padrao, a unica diferenca notavel e um painel de entrada sensivel ao toque com botoes correspondentes a um teclado QWERTY ingles.
text2 = Ao inserir um nome de liquido usando a tela de toque, a maquina despeja um copo de papel padrao de 340 gramas e o liquido indicado.
text3 = Foram realizados 97 testes iniciais (incluindo pedidos de agua, cafe, cerveja e refrigerantes, fluidos nao consumiveis como acido sulfurico, lavador de para-brisa e oleo de motor, e substancias que normalmente nao existem na forma liquida, como nitrogenio, ferro e vidro) e todos foram satisfatorios.

[SCP-372]
image path = 372.jpg
align x = left
align y = bottom
disablebackground = true
text1 = SCP-372 e uma criatura de genero desconhecido, medindo aproximadamente seis pes de comprimento da cabeca a cauda e pesando aproximadamente 44,9 quilogramas. Tem um corpo longo e esbelto com oito pares de membros estreitos.
text2 = SCP-372 aprendeu a prever os movimentos de todos os seres ao seu redor e usa essa tecnica para se esconder atras da cabeca de uma pessoa ou em um de seus pontos cegos.
text3 = No caso de uma brecha de contencao, todos os funcionarios sao aconselhados a relatar qualquer breve cintilacao com o canto do olho.

[SCP-427]
image path = 427.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-427 e um pequeno medalhao esferico ornamentado em prata polida. As esculturas ornamentais parecem inuteis.
text2 = SCP-427 foi criado colocando uma pilula do SCP-500 na cabine de entrada de SCP-914 e usando a configuracao "fina". Nao mostra nenhuma atividade incomum quando fechado. Quando SCP-427 e aberto e exposto ao tecido biologico, ele rapidamente regenera o dano celular e e de alguma forma capaz de purgar compostos invasores ou infeccoes.
text3 = No entanto, a exposicao a longo prazo cria um risco significativo para a saude. A medida que o medalhao cura os danos, ele otimiza os sistemas naturais do corpo. O pessoal da Classe D exposto ao dispositivo por mais de uma hora no total comecou a se transformar em uma massa disforme de tecido.
text4 = As "pilhas de carne" criadas por SCP-427 sao incrivelmente agressivas e atacam qualquer pessoal que vejam com resultados mortais. Eles sao muito resistentes a maioria das armas conhecidas.

[SCP-500]
image path = 500.jpg
align x = right
align y = bottom
text1 = SCP-500 e uma pequena caixa de plastico que, no momento da escrita, contem quarenta e sete (47) pilulas vermelhas.
text2 = Uma pilula, tomada por via oral, efetivamente cura o sujeito de todas as doencas dentro de duas horas, o tempo exato dependendo da gravidade e da quantidade de doencas do sujeito.
text3 = Apesar dos extensos testes, todas as tentativas de sintetizar ainda mais o que se acredita ser o ingrediente ativo das pilulas falharam.

[SCP-513]
image path = 513.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-513 e um sino de vaca enferrujado. Nao ha marcas ou gravuras em sua superficie devido a grande quantidade de corrosao.
text2 = Aproximadamente uma hora apos a exposicao a qualquer ruido produzido por SCP-513, as vitimas da exposicao comecam a avistar uma entidade designada SCP-513-1.
text3 = Todos os interrogatorios realizados ate agora indicam que SCP-513-1 e um humanoide alto e magro com maos anormalmente grandes.

[SCP-682]
image path = 682.jpg
align x = right
align y = bottom
text1 = SCP-682 e uma grande criatura vagamente reptiliana de origem desconhecida. Ele parece ter um odio pela vida, que expressou em varias entrevistas durante o confinamento.
text2 = SCP-682 sempre foi observado como tendo forca, velocidade e reflexos extremamente altos, embora os niveis exatos variem dependendo de sua forma. A capacidade de regeneracao e resistencia de SCP-682 e surpreendente, e foi visto se movendo e falando com seu corpo 87% destruido ou apodrecendo.
text3 = SCP-682 deve ser destruido imediatamente.

[SCP-714]
image path = 714.jpg
align x = center
align y = center
disablebackground = true
text1 = Aparentemente nada mais do que um anel de jade verde, SCP-714 mostrou expandir e contrair para caber confortavelmente ao redor do dedo de quem o toca, embora esta seja a menos importante de suas propriedades.
text2 = Vestir o SCP-714 tem varios efeitos significativos, como exaustao, restricao de descanso/sono, reacoes lentas e capacidade mental reduzida.
text3 = Portadores de SCP-714 mostram maior tolerancia a varios produtos quimicos e resistencia anormalmente alta a influencias memeticas e mentais.

[SCP-860]
image path = 860.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-860 e uma chave azul escura.
text2 = Em intervalos de tempo aparentemente aleatorios, uma serie de numeros aparece na folha da chave. Mais tarde descobriu-se que estas eram coordenadas UTM.
text3 = SCP-860 pode acionar e desbloquear qualquer fechadura de porta tradicional que exija uma chave localizada dentro da area de coordenadas especificada.
text4 = Quando SCP-860 e usado para destravar e abrir uma porta, ele nao leva ao seu destino usual. Em vez disso, ele se abre em uma pequena clareira na floresta, mais tarde designada como SCP-860-1.

[SCP-895]
image path = 895.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-895 e um caixao de carvalho decorado coberto no necroterio [REDIGIDO].
text2 = SCP-895 causa interrupcoes em equipamentos de vigilancia fotografica e de CFTV em um raio de 50 metros, semelhantes a alucinacoes vividas e perturbadoras, com duracao e regularidade variadas, correspondendo a proximidade da camera com SCP-895.
text3 = Dentro de 5 metros de SCP-895, as imagens capturadas podem causar trauma psicologico grave e histeria na maioria dos individuos.

[SCP-914]
image path = 914.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-914 e um grande dispositivo mecanico pesando varias toneladas e cobrindo uma area de dezoito metros quadrados, composto por parafusos, correias, polias, engrenagens, molas e outros mecanismos de relogio.
text2 = Quando um item e colocado na cabine de entrada e a chave e enrolada, SCP-914 ira "refinar" o item. Nenhuma energia e desperdicada no processo e o objeto e ajustado de acordo com os parametros especificados no painel frontal do SCP.
text3 = Nenhuma materia organica deve ser introduzida em SCP-914 a qualquer momento.

[SCP-939]
image path = 939.jpg
align x = left
align y = top
disablebackground = true
text1 = SCP-939 sao predadores endotermicos formadores de rebanho que exibem atrofia de varios sistemas semelhantes aos de organismos troglobios. SCP-939 tem uma media de 2,2 metros de altura quando na posicao vertical e pesa uma media de 250 kg, embora seu peso varie muito.
text2 = O principal metodo de SCP-939 de atrair presas e imitar a fala humana nas vozes de vitimas anteriores, embora a imitacao de outras especies e a caca noturna ativa tenham sido documentadas.
text3 = As presas geralmente morrem com uma unica mordida no cranio ou no pescoco; forcas de mordida acima de 35 MPa foram medidas.

[SCP-966]
image path = 966.jpg
align x = left
align y = bottom
disablebackground = true
text1 = SCP-966 so e visivel em comprimentos de onda que variam de aproximadamente 700 nm a 900 nm. Isso se aplica a todos os tecidos de SCP-966, independentemente de seu estado atual.
text2 = Seus metodos de caca envolvem a emissao de uma unica explosao de um tipo de onda anteriormente desconhecido, que inibe permanentemente a capacidade da criatura afetada de entrar em qualquer um dos estagios do sono NREM e REM. A capacidade de micro sono tambem e perdida.
text3 = Depois de privar suas vitimas de sono, SCP-966 persegue sua presa ate que a falta de descanso a imobilize. nesse ponto, SCP-966 ira consumi-lo.


[SCP-970]
image path = 970.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-970 e um fenomeno espacial no qual uma colecao de pecas se enrola em torno de si. Em todos os casos encontrados, isso acontece atraves de uma serie de portas que aparecem nas paredes, todas em linha reta, para que seja possivel avancar e terminar na posicao inicial.
text2 = A modificacao de salas nao afeta as salas e andares vizinhos. Nenhuma explicacao para o aparecimento deste fenomeno e ainda conhecida.
text3 = Desde a primeira descoberta do fenomeno SCP-970, mais exemplos desse tipo foram descobertos, com [DADOS EXPURGADOS]% deles em um raio de 800 quilometros do Setor 19.

[SCP-1025]
image path = 1025.jpg
align x = right
align y = bottom
text1 = SCP-1025 e um livro de capa dura de aproximadamente 1.500 paginas. A pagina de titulo e a lombada trazem o titulo "A Enciclopedia de Doencas Comuns".
text2 = Nenhuma outra copia de um livro com este titulo e editora foi encontrada, e nenhum registro da editora existe.
text3 = Os leitores do livro parecem apresentar sintomas de qualquer doenca que leem. O efeito pode demorar entre _ e __ horas para aparecer.

[SCP-1123]
image path = 1123.jpg
align x = center
align y = center
disablebackground = true 
text1 = SCP-1123 e um cranio humano sem maxilar inferior e todos os dentes. do lado de fora da escala frontal esta uma escrita Khmer moderna, escrita com sangue humano, que se traduz em "Lembre-se".
text2 = Testes geneticos confirmam que o cranio e o sangue vem do mesmo individuo. A escrita Khmer esta muito desbotada e e invisivel para a maioria dos sujeitos a mais de 5 metros de distancia.
text3 = Individuos dentro de 1 metro do objeto relatarao sangue fresco, como se " estivesse ainda molhado", bem como outros fenomenos sensoriais anormais, como cheiros, sons e respostas tateis.

[SCP-1162]
image path = 1162.jpg
align x = center
align y = center
disablebackground = true 
text1 = SCP-1162 esta atualmente em um buraco em uma parede de bloco de concreto no Local - [DADOS EXPURGADOS].
text2 = SCP-1162 e ativado quando um ser senciente alcanca os buracos, de modo que seus dedos tocam uma superficie tatil solida semelhante a localizacao atual de SCP-1162 e descobrem um objeto pequeno o suficiente para passar pelo buraco.
text3 = Esses objetos foram universalmente reconhecidos como algo que o usuario perdeu ou estava procurando em algum momento de sua vida.

[SCP-1499]
image path = 1499.jpg
align x = right
align y = bottom
disablebackground = true 
text1 = SCP-1499 e uma mascara de gas GP-5 sovietica. Um teste a prova d'agua realizado no objeto sugere que ele mantem sua funcionalidade original.
text2 = Os efeitos anomalos de SCP-1499 sao ativados quando um humano coloca SCP-1499 em sua cabeca. Aproximadamente um segundo apos SCP-1499 ser totalmente fixado na cabeca do sujeito, o sujeito desaparece de vista e nao e mais detectavel.
text3 = Ao usar SCP-1499, as cobaias relatam um ambiente completamente diferente do que tinham antes de usar SCP-1499.

[Insurgencia do Caos]
image path = chaos.jpg
align x = left
align y = bottom
disablebackground = true
text1 = A Insurgencia do Caos e um grupo dissidente da Fundacao, criado por uma celula rebelde que adquiriu varios SCPs uteis em 1924.
text2 = A principal base de operacoes da Insurgencia e desconhecida, assim como seus lideres. Esta organizacao e diretamente antagonica a Fundacao, chegando a confrontar a Fundacao em diversas ocasioes.
text3 = Os funcionarios da Fundacao sao  feito para estar atento a possiveis incursoes, tentativas de terrorismo e espioes da Insurreicao, e denunciar ao comando qualquer comportamento estranho de seus colegas.

[Classe-D]
image path = classd.jpg
align x = right
align y = bottom
text1 = O pessoal da Classe D e designado para lidar com itens de nivel Keter
text2 = O pessoal da classe D e recrutado entre os presos. Pessoas condenadas sao preferidas; Em tempos de coacao, pode ser autorizado o Protocolo 12, que permite o recrutamento de pessoas inocentes ou encarceradas por delitos menores.
text3 = Todo o pessoal da Classe D deve ser demitido no inicio do mes, e deve haver novos funcionarios prontos para substitui-los.

