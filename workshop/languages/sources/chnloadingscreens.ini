text1 = SCP基金会是一个致力于遏制并研究超自然物品和生物的组织.
text2 = 简称"SCP"意为"Special Containment Procedures"特殊收容程序 (和基金会的的非官方座右铭,"Secure"控制,"Contain"收容,"Protect"保护) 的首字母缩写相同-概括了基金会行动的目标和方法.
