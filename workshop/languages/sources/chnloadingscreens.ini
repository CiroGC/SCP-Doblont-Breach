[机动特遣队]
image path = mtf.jpg
align x = center
align y = center
text1 = 机动特遣队是专门负责异常项目或对特殊事件做出反应的小团队（通常有十个以上的个体，但是拥有50个以上个体的小组并不罕见）。
text2 = 机动特遣队E-11（“九尾狐”）是一支训练有素的特遣部队，负责保护并重新收容在Site-[已编辑]中的SCP项目。
text3 = 他们的任务包括但不限于：重新收容所有正在活动的，敌对的SCP项目来处理收容失效事件，营救幸存的基金会研究员以及处决所有D级人员。

[夜视仪]
image path = NVG.jpg
align x = right
align y = top
disablebackground = true
text1 = 如果发生了停电事件，那么夜视仪将会分发给进入此设施的所有MTF的成员。
text2 = 部分科学家也将得到夜视仪，但他们应该认真的去寻找避难所而不是出口。

[SCP-012]
image path = 012.jpg
align x = right
align y = top
disablebackground = true
text1 = SCP-012被考古学家K.M. 桑多瓦尔在意大利北部古墓的发掘中。 该物件是一部手写的乐谱，名为“ 在 Golgotha”，似乎并不不完整。
text2 = 红/黑色墨水最初被认为是某种形式的浆果或天然染料墨水，后来被发现是来自多个受害者人体的血液。
text3 = 由多个对象访问此SCP。每一个受害者都以自残的方式来获得并使用自己的血液来完成乐章，这一过程直接导致了随后的精神病和严重创伤。
[SCP-035]
image path = 035.jpg
align x = right
align y = top
disablebackground = true
text1 = SCP-035似乎是一个白色的陶瓷喜剧面具，尽管有时会变成悲剧面具。
text2 = 当SCP-035被放置在人脸上时，来自SCP-035的另一种脑电波模式会与原始宿主的电波模式重叠，从而有效地将其窒息并导致对象脑死亡。然后项目会声称是SCP-035中包含的意识。
text3 = 心理分析发现SCP-035具有极强的操纵性，能够迫使携带者的心理状态突然而深刻地变化。 SCP-035被证明是高度虐待狂，可以促使某些人仅凭语言说服就自杀。

[SCP-049]
image path = 049.jpg
align x = left
align y = center
disablebackground = true
text1 = SCP-049的外观为类人生物。但是，基金会目前无法更全面地研究其面部和身体，因为该项目似乎涵盖了15至16世纪欧洲传统瘟疫医生的服装。
text2 = SCP-049的触摸对人类致命。在与SCP-049的手接触后，受害者（以下统称为SCP-049-2）遭受[数据删除]并在瞬间死亡。
text3 = 然后，SCP-049生产出一个由[数据删除]制成的袋子，里面装有手术刀，针头，线和几小瓶尚未鉴定的物质，并开始解剖SCP-049-2，并将各种化学物质插入体内。
text4 = 大约20分钟后，SCP-049将让SCP-049-2恢复并变得服从。几分钟后，SCP-049-2将恢复生命体征并似乎正在恢复生命。


[SCP-066]
image path = 066.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-066是一团无定形的复杂编织线，重约一公斤。
text2 = 在事故066-2之后（参见事故报告066-2），SCP-066开始表现出与其先前特性高度不一致的行为。
text3 = SCP-066现在表现出显着的活动能力，并且会在有人在场时产生音符和异常效果，无论该人是否与SCP-066互动。


[SCP-079]
image path = 079.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-079是寄存于一台于1978年的Exidy Sorcerer微型计算机上的AI。
text2 = 尚不清楚SCP-079何时获得感情，但已知该软件已经发展到某种程度，即使在计算机中，其硬件也无法处理它。
text3 = 它已经通过了图灵测试，并且非常健谈，尽管语气非常粗鲁和令人讨厌。它也表现出逃脱的欲望。

[SCP-096]
image path = 096.png
align x = right
align y = bottom
disablebackground = true
text1 = SCP-096通常非常温顺，在其牢房内装有压力传感器，指示其整天大部分时间都在东墙附近移动。
text2 = 但是，当有人看到SCP-096的脸部时，无论是直接地，通过录像还是照片，SCP-096都会进入严重的悲伤。
text3 = 看到SCP-096的脸后大约一到两分钟，SCP-096将开始冲向观看其面孔的人。

[SCP-106]
image path = 106.jpg
align x = right
align y = bottom
text1 = SCP-106看起来是一个老年人形生物，通常有着高度腐烂的外形。他的外形经常发生改变，但是那“腐烂”程度被观察到各种各样的形式。
text2 = SCP-106能够对其触碰的固体导致一种“腐蚀”效应，在触碰数秒之后导致物质的物理性崩溃。材料会被观察到生锈、腐朽和最终崩溃的过程，并且会创造出一种黑色的、像黏液一样类似于包裹着SCP-106的物质的材料。
text3 = SCP-106可以穿过固体物质，并将其拉入被认为是其“口袋空间”的地方，以捕获并杀死其猎物。

[SCP-173]
image path = 173.jpg
align x = left
align y = bottom
text1 = SCP-173是由混凝土和钢筋建造,并含有Krylon牌喷漆之痕迹. SCP-173是拥有生命的,并且带有非常强的敌意.
text2 = SCP-173在有视线注视的情况下士不能移动的. 任何时候都不能把视线移开SCP-173. 在容器中的人员应在自己眨眼之前提前其他人.


[SCP-205]
image path = 205.jpg
align x = right
align y = bottom
disablebackground = true
text1 = SCP-205是一对在照相中使用的泛光灯。从两盏灯中射出的光线带有一种SCP-205所独有的特征并能够完全透过不是白色的任何表面。一旦光线接触到白色表面，它将如普通光线一般散射和反射，并失去所有的异常属性.
text2 = 如果光线持续不断通过任何物质，除了不产生影子外，每盏灯会在平滑的白色表面上显示一不明年轻女子的影子，例如52号隔间的投影幕.

[SCP-294]
image path = 294.jpg
align x = center
align y = bottom
disablebackground = true
text1 = 项目SCP-294外观为一标准咖啡贩卖机，唯一显著的不同之处在于它拥有输入用触摸板，其按键布局与英语QWERTY键盘相符.
text2 = 当向投币孔投入50美分硬币时，机器会示意用户使用触摸板输入任意液体的名称,执行这一行为后，机器会放下标准的12盎司纸杯，注入指定的液体.
text3 = 最初进行的97次测试（包括水、咖啡、啤酒、苏打水等饮品，诸如硫酸、雨刷液、机油等非消费品，还有通常不以液态形式存在的物质，如氮、铁以及玻璃）均成功.
[SCP-372]
image path = 372.jpg
align x = left
align y = bottom
disablebackground = true
text1 = SCP-372是一种未知的生物,大约6.5英尺(1.98米)长,从头部到尾部 一个重约99.2磅(44.99千克).他有着长而又薄的身体 并拥有细长的四肢总计八对手臂和腿.
text2 = SCP-372已经学会预测周围生命体的行动,并借此躲在猎物的任何盲 点里,比如头后.
text3 = 如果在违规操作下导致SCP-372的逃脱,所有人员都应该报告任何他们 发现的在角落出现的类似眼睛反光时发出的光芒.

[SCP-427]
image path = 427.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-427是一个小小的，装饰华丽的银色抛光表面小盒。它有这样一个华丽美观的外形的原因是未知的。它最宽处的周长大约3厘米.
text2 = 将SCP-500中的一片药放置进SCP-914并选择“精加工档”设置之后创造出了SCP-427。当它被关闭之后显出了某种不寻常的活性。当它打开时，一个小小的光球呈现在其中心。这个光球除了可见光谱外没有任何辐射或能量逸出.
text3 = 然而长期接触它将产生严重的健康危害。在该小盒进行疗伤时，它自行优化被治疗者的生物系统。如果花费至少10分钟来照射，被治疗者对疾病和中毒的抵抗几率将上升500%。如果花费至少15分钟，则该抗性将上升到1000%。照射15分钟之后肌肉系统将自行进化，增强其强度和疼痛容忍度200%-300%。所有的其他系统继续以一种“生物奇异性”进行进化。D级工作人员在装置下暴露了1小时以上后质量变异为一个无定形生物。并且随着暴露在SCP-427下的时间越来越长，变化得越来越快.
text4 = “血肉野兽”（其称呼来自于其外形）由SCP-427创造出来，具有高度的侵略性，并对视野内的所有人造成致命的攻击。它们能抵抗绝大多数已知的武器，但在1100摄氏度（2000华氏度）下会造成足够严重的热休克。不能准确测定其智能水平，但对于完全变异体，测绘出的生物大脑和其他的生物系统优化显示其智商可能超过400.

[SCP-500]
image path = 500.jpg
align x = right
align y = bottom
text1 = SCP-500是装于一塑料小罐内的红色药片，写下本段时数目为四十七（47）.
text2 = 一片药在口服后两小时内即可有效治愈所有疾病，具体时间取决于对象患病的种类与严重性.
text3 = 尽管进行过大量实验，所有对该药片的有效成分进行合成的尝试都以失败告终.

[SCP-513]
image path = 513.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-513是一个很不起眼且生锈的牛铃,他的表面出了大量被腐蚀 的部分以外并没有任何标记或者雕刻.
text2 = 所有接触到SCP-513所发出铃声的的受害者,会在一个小时之后看见 一个奇怪的实体,这个实体被指定为SCP-513-1.
text3 = 迄今所有对受害者的审讯表明,SCP-513-1是一个高个子且瘦弱并拥 有一对异常大的手的人形物体.
[SCP-682]
image path = 682.jpg
align x = right
align y = bottom
text1 = SCP-682是一个巨大并且尚不清楚种类的爬行动物. 在他与SCP-079交流时似乎表达出了他对所有生命的憎恨.
text2 = SCP-682已经被观察到具有极强的力量,速度,和反射神经不过目前尚 不明确SCP-682所能到达的极限水平.SCP-682的再生能力和应变能力也是 非常惊人的并且已经发现其在身体87％被销毁或腐烂的情况下移动 以及说话(SCP-682能说人类语言).
text3 = SCP-682应该尽快被消灭.

[SCP-714]
image path = 714.jpg
align x = center
align y = center
disablebackground = true
text1 = 虽然看起来只是一个绿色的翡翠戒指,但是SCP-714已经被发现可以让 任何佩戴它的人的手指变粗或者变细,直到正 好符合SCP-714的尺寸.
text2 = 带着SCP-714主要有几个影响,包括疲惫,强烈想休息或睡眠,反应变慢 减少心理能力.
text3 = 带着SCP-714的人被观察到具有增加对化学试剂的耐性以及异常的韧 性并对心理有一定影响.

[SCP-860]
image path = 860.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-860是一把深蓝色且不起眼的钥匙.
text2 = 似乎在随机的时间间隔里,钥匙的匙刃上会出现一系列号码.这些号 码后来被发现是一种地理坐标.
text3 = SCP-860 能够打开任何号码所对应地区的传统门锁.
text4 = 当SCP-860解锁并打开门时,门的另外一端所连接的并不是本应该通 往的地方,相反,所连接的地区是一个充满蓝色雾气的森 林,这座森林被进一步制定为SCP-860-1.

[SCP-895]
image path = 895.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-895是一个来自于[数据已被删除]太平间由橡木制成的棺材.
text2 = SCP-895会导致在通过距离50米以内用视频或者摄像监控设备观察SCP-895 的人员出现生动而又令人抓狂的幻觉,距离越近所见到的幻觉越恐怖越丰富.
text3 = 在5米范围内直接用视频或摄影监控设备观察SCP-895,镜头会捕捉到可以引 起严重心理创伤的幻觉,并有可能使监控者癫狂甚至死亡.
[SCP-914]
image path = 914.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-914 是一个大型的发条装置,重达数吨,占地十八平方米 由螺杆驱动,皮带,皮带轮,齿轮,弹簧和其他发条组成.
text2 = 当一个物体被放进输出间时,可用面板启动机器 SCP-914将会开始"精炼"输入间的物品,神奇的是在这个过程中不会有 能量的损失对物体的"精炼"程度和面板上所选择的程度相同.
text3 = 因为曾经的实验事故 在任何时间里任何有机物质(有生命的物质)都不被允许被"精炼".

[SCP-939]
image path = 939.jpg
align x = left
align y = top
disablebackground = true
text1 = SCP-939是一种群居性的温血食肉动物，其多处身体系统产生了类似穴居生物的退化状况。SCP-939的皮肤呈半透明的红色，吸水性很强，化学成分近似于血红蛋白。SCP-939直立时的平均身高2.2米，平均体重250千克，但个体之间体重差异较大.
text2 = SCP-939诱捕猎物的主要方式是用其过去的受害者的声音模仿人类讲话，但也有模仿其他生物和夜间主动出击的情况被记录在案.
text3 = 它们通常只需在头盖骨或颈部猛咬一口就能杀死猎物 据测量咬合的压强大于35MPa.


[SCP-966]
image path = 966.jpg
align x = left
align y = bottom
disablebackground = true
text1 = SCP-966只有在波长范围从700纳米到900纳米左右下才看得见。这适用于所有SCP-966的组织，无论它当前状态如何.
text2 = 它们的狩猎方法包括发出一波前所未见的种类的波长（被称为███波长，以纪念已故的██████博士），这种能力会永久抑制受影响的猎物NREM和REM睡眠状态。同时失去浅睡的能力.
text3 = 在剥夺了猎物的睡眠后，SCP-966会一直保持潜行跟踪直到猎物因为缺乏休息而瘫痪。此时，SCP-966会持续进食直到猎物吃尽.


[SCP-970]
image path = 970.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-970是一种空间异常现象，即多个房间出现了群体自我循环。在所有事例中其表现为，一连串位于同一直线上的门，连续打开并穿过后将回到初始位置.
text2 = 这些房间的变化不会影响邻近的房间与楼层。目前尚没有能解释该现象的理论.
text3 = 事件发生后，又发现了██例相同的异常现象，其中██%都分布在Sector-19方圆800公里的范围内。其中突出的一例出现在[数据删除]立法院中.

[SCP-1025]
image path = 1025.jpg
align x = right
align y = bottom
text1 = SCP-1025是一本硬皮书,它大概有1500页,书的封面和书籍的所写的标 题为"常见疾病的百科全书".
text2 = SCP-1025被发现没有其他任何一部和他一样的书,其书上给出的标题和 出版商均没有任何记录.
text3 = 这本书的读者将会出现他们所读疾病的症状,症状的效果一般在几小时 之间.
[SCP-1123]
image path = 1123.jpg
align x = center
align y = center
disablebackground = true 
text1 = SCP-1123是一个失去了下颌和全部牙齿的人类头骨。在其前额外部用人血写着文本，是近代高棉文，翻译为“记得.
text2 = 头骨和血液都被确认可以追溯到197█年，而基因检测证实都是同一人. 高棉语文本已经严重褪色，并且大多数人在5米外就无法看到.
text3 = 尽管如此，当一个测试者靠近SCP-1123他们会报告说文本变得越来越清晰，并在接近到不到1米时变得像新近写上去的一样。一部分测试者在此距离上报告说文本“仍旧是湿的。”该效应无法通过光学设备重现。为了记录文本照片需要光学放大或UV紫外线。（后者因为容易促进项目降解而被禁止使用。）测试者在此距离上同时报告其他异常感官现象，包括气味（诸如烤肉或骨灰），声音（诸如轻微的哭泣，低声的心跳或呼吸，或遥远的脚步声），触觉回应（诸如眼睛有沙粒，手背有蚂蚁在爬，或脚底有碎玻璃.

[SCP-1162]
image path = 1162.jpg
align x = center
align y = center
disablebackground = true 
text1 = SCP-1162，当前是，一个在Site 19的收容隔间4的煤渣砖墙上的一个洞。其直径约为14.5厘米，而其深度根据当前使用者的不同而会有所变化
text2 = SCP-1162将会在一个有感知生命将其胳膊尽可能长的探入洞中时启动，随后他们的指头将会碰到一个固体表面，类似于当前SCP-1162所在的墙面，随后他们会发现在他们的指尖下有一个小到能穿过洞中的物体.
text3 = 这些物品总是会被使用者认为是自己丢失的什么东西，或是他们在生命中寻找的某件东西.

[SCP-1499]
image path = 1499.jpg
align x = right
align y = bottom
disablebackground = true 
text1 = SCP-1499是一苏联GP-5防毒面具。对项目的气密试验显示其原有防毒功能完好.
text2 = SCP-1499的异常效应会在一人类将其佩戴在头上时发生。在SCP-1499完全罩住对象的头部约一秒后，对象将从视线中消失且不再能被侦测到.
text3 = 一旦戴上SCP-1499，测试对象报告称会进入了一个与之前完全不同的环境.

[混沌分裂者]
image path = chaos.jpg
align x = left
align y = bottom
