text1 = The Chaos Insurgency(混沌叛乱)混沌叛乱是基金会的一个特殊团体 作为非常流氓的一个团体在基金会中经常擅离职守 和几个十分重要且有用的部门一同在1924年成立...
text2 = The Chaos Insurgency(混沌叛乱)多年前的主要任务在基金会中是未知 的由于他的领导人的关系The Chaos Insurgency(混沌叛乱)曾多次与SCP基金会发生冲突.
text3 = 如今The Chaos Insurgency(混沌叛乱)的人员被用于处理可能出现的袭击 恐怖分子的企图和内部的间谍,以及警告当地任何有奇怪行为的人员.

[D级人员]
image path = classd.jpg
align x = right
align y = bottom
text1 = D组人员是被指定操作Keter-level级(科特级)物品或生物的人员.
text2 = D组人员一般是从死刑犯或重罪犯中招募而来,在危机或紧迫的情 况下,根据第12号议定书,可被授权允许招募无辜或者轻度犯罪的人员.
text3 = 所有D组人员都将在每个月初被处理,而每一个D组人员都会有一 个新成员做好准备,以便随时替代被处理或者在实验中死亡的D组人员.

