Si eres SCP podras hacer un sonido tocando click derecho en el mouse.
Cuando eres SCP, para golpear a un jugador deberas tocar el click izquierdo del mouse.
En este mod hay chat de voz, puedes hablar presionando la tecla V.
Antes de comenzar a jugar, te recomendamos que cambies tu nickname en la configuracion del multijugador.
Te recomendamos leer las instrucciones antes de jugar.
Este mod tiene armas, podras encontrarlas en el modo "Breach" o seteartelas por consola.
Puedes parpadear manualmente presionando la barra espaciadora.
Puedes combinar ciertos items arrastrandolos a otros en el inventario.
Puedes soltar items clickeando o arrastrandolos fuera del inventario.
Para apuntar deberas presionar click izquierdo.
Puedes hablar con las personas a traves de la radio.