Wenn Sie ein SCP sind, konnen Sie einen Ton machen, indem Sie mit dem rechten Mausklick klicken.
Wenn Sie ein SCP sind, mussen Sie, um einen Spieler zu beruhren, auf den linken Mausklick klicken.
In diesem Mod gibt es einen Voice-Chat, sie konnen sprechen, indem Sie die V-Taste drucken.
Bevor Sie mit dem Spielen beginnen, empfehlen wir Ihnen, Ihren Spitznamen in den Multiplayer-Einstellungen zu andern.
Wir empfehlen Ihnen, die Anweisungen vor dem Spielen zu lesen.
Dieser Modus hat Waffen, Sie konnen sie im "Breche" -Modus oder mit der Konsole finden
Sie konnen manuell blinken, indem Sie die LEERTASTE drucken.
Sie konnen einige Gegenstande kombinieren, indem Sie sie auf andere im Inventar ziehen.
Sie konnen Objekte nehmen, indem Sie auf sie klicken oder sie aus dem Inventar loschen.
Um zu zielen, mussen Sie den rechten Mausklick drucken.
Sie konnen mit Leuten im Radio sprechen.
Indem du als SCP-106 spielst, erlaube dem anderen SCP, das Opfer zu toten, um jede Chance zu vermeiden, dass sie deine Taschendimension uberleben.
Wahrend Sie SCP-049-2 spielen, erlauben Sie SCP-049, das Opfer zu zombifizieren, anstatt es selbst zu toten. Handle nur als Schwamm des Schadens fur deinen Meister und blockiere Ausweichmanover.
SCP-966 ist nur durch die Nachtsichtbrille sichtbar.
SCP-173 kann sich bei direktem Augenkontakt nicht bewegen.
Die Waffenkammer in der Lichteindammungszone ist eine grosartige Moglichkeit, jeden zu zerstoren, der sich dir widersetzt.
Wenn Sie sich in unmittelbarer Nahe von SCP-939 befinden, werden Ihre Schritte erkannt. Hocken oder Gehen verringert die Wahrscheinlichkeit der Entdeckung, verhindert es aber nicht vollstandig.