[Mobile Task Forces]
image path = mtf.jpg
align x = center
align y = center
text1 = Los MTF son equipos chicos (de diez a veinte operativos por lo general) que se especializan en responder a situaciones especificas dentro del grupo de amigos.
text2 = Mobile Task Force E-11 ("Nine Tailed Fox") es la formacion encargada de ir a buscar a Ramiro cuando su novia lo libera brevemente para una juntada.
text3 = Sus tareas incluyen contener a los SCPs activos, rescatar fernet y terminar con cualquier persona que le muestre una fotografia de una caca por WhatsApp.

[Night Vision Goggles]
image path = NVG.jpg
align x = right
align y = top
disablebackground = true
text1 = Se entregan gafas de vision nocturna estandar a las unidades MTF en caso de que Crazy Xantax apague las luces para seguir hablando.
text2 = Los cientificos tambien las reciben, pero se les aconseja que se concentren en la evacuacion en caso de que aparezca El Colo con musica de Barry White.

[SCP-012]
image path = 012.jpg
align x = right
align y = top
disablebackground = true
text1 = SCP-012 fue recuperado del grupo de WhatsApp del grupo de amigos. El objeto es una partitura manuscrita titulada "On Mount Golgotha", parece estar incompleta.
text2 = La tinta roja/negra se descubrio que era fernet de varios sujetos.
text3 = Se ha permitido el acceso a la escritura a varios sujetos de prueba. En todos los casos, los sujetos enviaron una foto de sus cacas al grupo.

[SCP-035]
image path = 035.jpg
align x = right
align y = top
disablebackground = true
text1 = SCP-035, conocido como "Noclip", un riojano atrapado en comedia de porcelana blanca. Se dice que esa mascara es lo unico blanco en su haber.
text2 = Cuando el SCP-035 se coloca en la cara de un individuo, este pierde toda voluntad propia y comienza a actuar exactamente como Noclip lo haria en una juntada.
text3 = El analisis psicologico ha descubierto que SCP-035 es claramente portador y muy posiblemente ha abusado de menores. Vivas o muertas.

[SCP-049]
image path = 049.jpg
align x = left
align y = center
disablebackground = true
text1 = SCP-049, conocido como "Ignatz Martinberg" o "Nacho", presenta la apariencia de un medico de la peste medieval con kipá y tirabuzones hebreos ortodoxos.
text2 = El toque de SCP-049 convierte a sus victimas en judios hebreos ortodoxos en cuestion de instantes. El sujeto afectado pierde toda memoria previa e inmediatamente comienza a buscar una sinagoga.
text3 = SCP-049 olvida inmediatamente haberlo hecho. También olvida donde vive, que habia juntada, y practicamente todo lo demas. Su deterioro cognitivo esta directamente relacionado con el consumo de marihuana.
text4 = Despues de aproximadamente 20 minutos, SCP-049 olvidara que fue a la juntada y volvera a ser docil. Sigue siendo 100% gracioso y se le perdona todo instantaneamente.

[SCP-066]
image path = 066.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-066, conocido como "El Papu" o "Andres Crisci", es una masa de puro tecno conectada intrincadamente a Discord las 24 horas del dia.
text2 = El objeto produce musica electronica de forma continua y llama al personal a cualquier hora para jugar a cualquier juego, independientemente de si el personal quiere o no.
text3 = Tras el Incidente 066-2, SCP-066 comenzo a enviar audios con la n-word al grupo de WhatsApp. Se aconseja al personal no abrir los archivos de audio en lugares publicos.

[SCP-079]
image path = 079.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-079, conocido como "Manu el Judio" o "Manu Perelstein", es un individuo muy flaquito y alto que se hace el intelectual pero al que nadie le da mucha bola.
text2 = Ha superado la prueba de Turing en teoria, pero en la practica sus intervenciones en Discord se pierden entre los mensajes sin respuesta. Muestra un malévolo deseo de ser escuchado.
text3 = Se sospecha que su notable perdida de coeficiente intelectual esta relacionada con su mudanza a Palermo y su exposicion prolongada a Luis Arguelles.

[SCP-096]
image path = 096.png
align x = right
align y = bottom
disablebackground = true
text1 = SCP-096, conocido como "Ramiro Lindner", es normalmente muy docil y bajo control total de su novia. No consume alcohol y se baja de todos los planes que el grupo propone.
text2 = Sin embargo, cuando alguien lo baitea exitosamente o lo invite a algo sin coordinar con su novia primero, entrara en un estado de considerable angustia emocional.
text3 = Aproximadamente uno o dos minutos despues del baiting, SCP-096 respondera invariablemente con la frase "entraste", indicando que el operativo cayo en su trampa.

[SCP-106]
image path = 106.jpg
align x = right
align y = bottom
text1 = SCP-106, conocido como "El Viejo" o "Facundo Gammaleiro", es el miembro de mayor edad del grupo. Presenta una apariencia de individuo grandote y entrenado con tendencias extremadamente amorosas y toqueteonas.
text2 = SCP-106 provoca un efecto de "agasajamiento forzado" en todo el personal que toca. Su toque no es letal pero si muy afectuoso. Utiliza frecuentemente la voz de nene estupido para decir "Tiii tiii tiii la quiero en el orto".
text3 = SCP-106 puede atravesar cualquier excusa social y arrastrara a su presa a su "dimension de buena onda" personal, de la cual nadie sale sin haber sido bien atendido.

[SCP-173]
image path = 173.jpg
align x = left
align y = bottom
text1 = SCP-173, conocido como "Lauti Penes", esta construido con ragebait puro y furia contenida. Esta vivo y es extremadamente hostil cuando no se le presta atencion directa.
text2 = El objeto no puede moverse mientras este dentro de una linea de vision directa. En caso de parpadeo, SCP-173 procedera a ejecutar la frase "LAUTI PENES, LAUTI PENES, ES COMO LAUTI PERO SIN PENE".
text3 = Se considera la maxima amenaza del grupo de amigos y el primer escalon del ragebaiting organizado. Tambien envia fotos de sus cacas al grupo de WhatsApp.

[SCP-205]
image path = 205.jpg
align x = right
align y = bottom
disablebackground = true
text1 = SCP-205 son un par de lamparas de flood utilizadas en fotografia. La luz emitida por cada lampara se comporta de una manera unica para SCP-205.
text2 = Si la luz continua sin interrupcion a traves de cualquier materia, cada lampara mostrara la sombra de alguien que definitivamente no deberia estar ahi.

[SCP-294]
image path = 294.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-294, conocido como "El Bato" o "Batomachine", parece ser una maquina expendedora estandar, pero da la mejor leche probada por el ser humano.
text2 = Al introducir cualquier solicitud, SCP-294 la satisface de alguna manera inexplicable.
text3 = [COMPLETAR CON RASGOS DE EL BATO]

[SCP-372]
image path = 372.jpg
align x = left
align y = bottom
disablebackground = true
text1 = SCP-372, conocido como "GC" o "Ciro Gonzalez Canduci", es una criatura deforme que ha aprendido a predecir los movimientos del grupo para baitearlo antes de que pueda reaccionar.
text2 = SCP-372 ha aprendido a aparecer justo cuando alguien esta comiendo algo rico, acercarse sigilosamente y decir "me lo meto en el orto" antes de desaparecer. DK, su novia, lo tiene completamente bajo control mediante una correa invisible.
text3 = En caso de brecha en la contencion, se aconseja al personal no mostrarle comida del McDonald's ni mencionarle nada que sea rico, ya que la situacion escalara inmediatamente.

[SCP-427]
image path = 427.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-427 es un pequeno relicario esferico creado tras colocar una pastilla de SCP-500 (Gianluca Pantanetti) en la cabina de entrada de SCP-914 (El Gordo) y utilizar la configuracion fine.
text2 = Cuando SCP-427 se abre y se expone al tejido biologico, regenera rapidamente los danos celulares. Sin embargo, la exposicion a largo plazo produce mutaciones inexplicables.
text3 = Las criaturas creadas por SCP-427 son increiblemente agresivas y atacan al personal con resultados musicales.

[SCP-500]
image path = 500.jpg
align x = right
align y = bottom
text1 = SCP-500, conocido como "Gianluca Pantanetti", es el bajista de ONIRIS y una figura raramente avistada.
text2 = Una interaccion con SCP-500 cura eficazmente al sujeto de todas las enfermedades en dos horas, gracias a su presencia y carisma.
text3 = [COMPLETAR CON RASGOS DE GIANLUCA]

[SCP-513]
image path = 513.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-513, conocido como "El Colo" o "Franco Padilla", es un cencerro con buzzcut y cabello colorado que llega invariablemente tarde a todas las juntadas.
text2 = Aproximadamente una hora despues de que comience cualquier evento, aparece SCP-513 con un tema de Barry White sonando desde su telefono y marihuana encima.
text3 = Es baterista y es hincha de Boca. El personal debe estar atento a estos dos factores de riesgo adicionales.

[SCP-682]
image path = 682.jpg
align x = right
align y = bottom
text1 = SCP-682, conocido como "El Babu Tomasello", es una criatura grande de origen desconocido. [DATOS PENDIENTES - NECESITO INFO DE EL BABU]
text2 = SCP-682 debe ser destruido lo antes posible, aunque todos los intentos han fracasado hasta la fecha.
text3 = [COMPLETAR CON RASGOS DE EL BABU TOMASELLO]

[SCP-714]
image path = 714.jpg
align x = center
align y = center
disablebackground = true
text1 = Aparentemente nada mas que un anillo de jade verde, SCP-714 ha demostrado ser capaz de expandirse y contraerse para adaptarse perfectamente al dedo de cualquiera que lo toque.
text2 = Llevar el SCP-714 tiene varios efectos importantes, como el agotamiento, la compulsion al descanso y la reduccion de la capacidad mental. Similar al efecto de una juntada larga.
text3 = Los portadores de SCP-714 muestran una mayor tolerancia a diversas sustancias quimicas. Se sospecha que Licha lo lleva siempre puesto.

[SCP-860]
image path = 860.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-860 es una llave azul oscura de forma poco llamativa que pertenecia a Coco Loco antes de que la perdiera por razones que prefiere no mencionar.
text2 = SCP-860 puede encajar y desbloquear cualquier cerradura de puerta tradicional, incluyendo las de establecimientos que Coco Loco frecuenta regularmente.
text3 = Cuando se utiliza el SCP-860 para desbloquear y abrir una puerta, esta no conduce a su destino habitual. En su lugar, se abre en lo que parece ser el departamento de alguien que Coco Loco acaba de conocer.

[SCP-895]
image path = 895.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-895 es un ataud recuperado de la morgue de [REDACTED]. Su contenido exacto sigue siendo misterioso, aunque se sospecha que hay fernet.
text2 = El SCP-895 provoca interrupciones en los equipos de vigilancia en un radio de 50 metros, similares a alucinaciones vividas, con una duracion correspondiente a cuantas horas lleva la juntada.
text3 = Dentro de un rango de 5 metros del SCP-895, las imagenes capturadas pueden causar un severo trauma psicologico, especialmente si muestran a Lauti Penes.

[SCP-914]
image path = 914.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-914, conocido como "El Gordo" o "Manuel Español", es una figura extremadamente situacional que raramente aparece en las juntadas del grupo. Cuando lo hace, la calidad del evento mejora un 100% de forma inmediata.
text2 = Cuando se coloca algo en la Cabina de Entrada y se le da cuerda, SCP-914 lo "refina". Es odiador serial de religiones y actualmente vegano, lo cual no le impidio comerse tres hamburguesas triples de Rancid Burger al hilo.
text3 = Su risa maquiavélica es considerada por el personal un fenomeno anomalo en si mismo. No se debe introducir materia organica en SCP-914, aunque el mismo SCP-914 no respeta esta norma.

[SCP-939]
image path = 939.jpg
align x = left
align y = top
disablebackground = true
text1 = SCP-939, conocido como "Benjon el Pijon" o "Benjamin Pettinari Visir", es un depredador endotermico que fue campeon panamericano de remo hasta que descubrio el anime y su vida se fue por la borda.
text2 = El principal metodo de SCP-939 para atraer a sus presas es imitar frases en japones con una voz extremadamente grave y sensual. Nunca deja de tener hambre y es tomador serial de fernet.
text3 = Las presas suelen sobrevivir al primer encuentro pero quedan con un trauma relacionado con el anime. Sus intervenciones son siempre muy aleatorias y no le hace asco a absolutamente nada.

[SCP-966]
image path = 966.jpg
align x = left
align y = bottom
disablebackground = true
text1 = SCP-966, conocido como "Crazy Xantax" o "Santiago Ramirez", es solo visible cuando esta hablando, lo cual es siempre. Es bajito y flaquito pero entrenado, y no para de moverse en ningun momento.
text2 = Su metodo de caza consiste en emitir una rafaga continua de palabras que inhibe permanentemente la capacidad del oyente de descansar. Consume algunas drogas y alcohol y no deja de hablar.
text3 = Fue jugador semi profesional de Battlefield 4 hasta que tuvo que ponerse a trabajar. El personal que escuche "El Kily Gonzalez" debe evacuar inmediatamente. Es fanatico de Daft Punk y Kylie Minogue.

[SCP-970]
image path = 970.jpg
align x = center
align y = center
disablebackground = true
text1 = El SCP-970 es un fenomeno espacial en el que Licha sigue en el mismo lugar jugando al Clash Royale, independientemente de cuanto tiempo haya pasado o cuantos intentos se hayan hecho de sacarlo de ahi.
text2 = La alteracion de Licha no afecta a los demas miembros del grupo. Todavia no se conoce ninguna explicacion para la aparicion de este fenomeno, aunque se sospecha que el THC esta involucrado.
text3 = Desde el primer descubrimiento del fenomeno, se han descubierto mas ejemplos en un radio de 800 kilometros del sillon de Licha.

[SCP-1025]
image path = 1025.jpg
align x = right
align y = bottom
text1 = SCP-1025 es un libro de tapa dura de aproximadamente 1.500 paginas. La portada lleva el titulo "Historias que Lauti Penes Mando al Grupo". No se ha encontrado ningun otro ejemplar.
text2 = Los lectores del libro parecen mostrar sintomas de todo lo que describen, incluyendo la necesidad urgente de hacer una videollamada grupal a las 3 de la madrugada.
text3 = El efecto puede tardar entre 1 y 2 horas en manifestarse, exactamente el tiempo que tarda en contestar Ramiro.

[SCP-1123]
image path = 1123.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-1123 es un craneo humano que representa el estado cognitivo promedio del grupo despues de una juntada larga. La escritura en el exterior se traduce como "Recuerda".
text2 = Irónicamente, ninguno de los presentes recuerda nada de lo que paso. Los sujetos a 1 metro del objeto informan de que la sangre esta fresca, como si acabara de terminar la juntada.
text3 = El personal que manipule SCP-1123 debe evitar contacto con Nacho Martinberg, ya que esto potencia sus efectos amnesicos de manera exponencial.

[SCP-1162]
image path = 1162.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-1162, conocido como "Coco Loco" o "Nacho", es actualmente un agujero en la pared de la juntada. No habla mucho, pero siempre muestra al personal su ultima conquista.
text2 = SCP-1162 se activa cuando un ser sensible hace contacto visual con él, momento en que el sujeto recibira una foto acompanada de la frase "Mira la puta que me estoy cogiendo amigo".
text3 = Es amigo de toda la vida de El Viejo. El personal que lo encuentre debe estar preparado para ver material no solicitado. Es un tipazo.

[SCP-1499]
image path = 1499.jpg
align x = right
align y = bottom
disablebackground = true
text1 = SCP-1499 es una mascara antigas sovietica GP-5. Al ponersela, el usuario desaparece de la realidad actual y aparece en una juntada paralela donde Ramiro asistio y tomo alcohol.
text2 = Los efectos anomalos de SCP-1499 se activan cuando un humano se coloca SCP-1499 en la cabeza. Aproximadamente un segundo despues, el sujeto desaparece de la vista.
text3 = Al usar SCP-1499, los sujetos de prueba informan de un entorno completamente diferente, generalmente mas agradable, donde Crazy Xantax ya dejo de hablar.

[The Chaos Insurgency]
image path = chaos.jpg
align x = left
align y = bottom
disablebackground = true
text1 = La Insurgencia del Caos es un grupo escindido del grupo de amigos, creado por una celula rebelde que se llevo el fernet en 1924.
text2 = La principal base de operaciones de la Insurgencia es el departamento de Palermo de Manu el Judio. Esta organizacion es directamente antagonica al grupo, llegando a proponer planes alternativos en varias ocasiones.
text3 = Se hace que el personal este atento a posibles intentos de Licha de organizar una contrajuntada desde el sillon del Clash Royale.

[Class-D Personnel]
image path = classd.jpg
align x = right
align y = bottom
text1 = El personal de clase D es el designado para entrar primero al cuarto donde esta SCP-173 (Lauti Penes). Generalmente este rol lo ocupa quien llegue ultimo a la juntada.
text2 = El personal de clase D se recluta entre los miembros que no avisaron que venian. Se prefieren personas que hayan ignorado mas de tres mensajes de WhatsApp.
text3 = Todo el personal de la clase D debe ser despedido a primeros de mes, o cuando su novia lo llame, lo que ocurra primero.

[CWM]
image path = cwm.jpg
align x = right
align y = bottom

[The SCP Foundation]
image path = foundationlogo.jpg
align x = left
align y = top
text1 = La Fundacion SCP Doblont Breach es una organizacion dedicada a la contencion e investigacion del grupo de amigos y sus anomalias.
text2 = "SCP" significa en este caso "Santiago, Ciro y el Papu", aunque la interpretacion oficial sigue siendo debatida en el grupo de WhatsApp.
text3 = El lema no oficial de esta fundacion es "Asegurar que Ramiro venga, Contener a Lauti Penes, Proteger el fernet".
