[Mobile Task Forces]
image path = mtf.jpg
align x = center
align y = center
text1 = MTFs sind kleine Teams (in der Regel 10 bis 20 Agenten, obwohl es Gruppen von mehr als 50 Agenten gibt), die sich darauf spezialisiert haben, bestimmte Rollen zu erfullen oder auf bestimmte Situationen zu reagieren.
text2 = Die Mobile Task Force E-11 ("Neunschwanzfuchse") ist eine intensiv ausgebildete Einheit, die sich auf den Schutz und die Erhaltung der auf dem Gelande gespeicherten SCP-Elemente spezialisiert hat. - [DATEN GELOSCHT].
text3 = Zu ihren Aufgaben gehoren die Verwaltung von Containment-Strangen, die alle aktiven und feindlichen SCP-Instanzen enthalten, die Rettung Uberlebender Foundation-Mitarbeiter und die Eliminierung von Schurken-D-Class-Mitarbeitern.

[Nachtsichtbrille]
image path = NVG.jpg
align x = right
align y = top
disablebackground = true
text1 = Standard-Nachtsichtbrillen werden DEN MTF-Geraten im Falle eines Stromausfalls zur Verfugung gestellt.
text2 = Wissenschaftler besitzen sie auch, aber es ist wichtiger, sich im Falle eines Stromausfalls auf die Evakuierung zu konzentrieren.

[SCP-012]
image path = 012.jpg
align x = right
align y = top
disablebackground = true
text1 = SCP-012  von dem Archaologen K.M. Sandoval wahrend der Ausgrabung eines Grabes in Norditalien behandelt. Das Objekt ist eine handschriftliche Partitur mit dem Titel "Auf dem Berg Golgatha", sie scheint unvollstandig zu sein.
text2 = Rote / schwarze Tinte, die zuerst als eine Art Tinte auf Beerenbasis oder naturlicher Farbstoff gedacht wurde, stellte sich spater als menschliches Blut von verschiedenen Probanden heraus.
text3 = Mehreren Testpersonen wurde der Zugang zum Schreiben gestattet. In allen Fallen verstummelten sich die Probanden selbst, um ihr eigenes Blut zu verwenden, um das Stuck zu beenden, was zu spateren Symptomen einer Psychose und einem massiven Trauma fuhrte.

[SCP-035]
image path = 035.jpg
align x = right
align y = top
disablebackground = true
text1 = SCP-035 scheint eine weise Porzellan-Comedy-Maske zu sein, obwohl sie sich manchmal in eine Tragedie-Maske verwandelt.
text2 = Wenn SCP-035 auf das Gesicht einer Person gelegt wird, uberlappt ein anderes SCP-035-Zerebralwellenmuster das des ursprunglichen Wirts, loscht es aus und verursacht den Hirntod des Subjekts. Das Subjekt gibt dann vor, das in SCP-035 enthaltene Bewusstsein zu sein.
text3 = Psychologische Analysen haben ergeben, dass SCP-035 eine hochgradig manipulative Natur besitzt, die in der Lage ist, plotzliche und tiefgreifende Veranderungen im psychologischen Zustand des Interviewers zu erzwingen. SCP-035 ist an die extrem Sadisten gegangen und hat einige allein mit sprachlicher uberzeugung zum Selbstmord angestiftet.

[SCP-049]
image path = 049.jpg
align x = left
align y = center
disablebackground = true
text1 = SCP-049 hat ein humanoides Aussehen; Die Stiftung ist jedoch nicht in der Lage, sein Gesicht und seinen Korper genauer zu studieren, da er mit dem bedeckt ist, was die Gewohnheit des traditionellen europaischen Pestarztes des funfzehnten und sechzehnten Jahrhunderts zu sein scheint.
text2 = Die Beruahrung von SCP-049 ist fur den Menschen ausnahmslos todlich. Bei Kontakt mit den Handen von SCP-049 erleidet das Opfer (im Folgenden scp-049-2) [DATA DELETED] und stirbt innerhalb weniger Augenblicke.
text3 = SCP-049 Zieht dann einen Beutel [DATA REMOVED] heraus, der Skalpelle, eine Nadel, einen Faden und mehrere Flaschchen einer noch nicht identifizierten Substanz enthalt, und beginnt, SCP-049-2 aufzulosen und verschiedene Chemikalien in den Korper einzufuhren.
text4 = Nach etwa 20 Minuten naht SCP-049 SCP-049-2 und es wird wieder fugsam. Nach ein paar Minuten wird SCP-049-2 seine Vitalfunktionen wiedererlangen und scheint wiederbelebt zu werden.

[SCP-066]
image path = 066.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-066 ist eine amorphe Masse aus fein verdrilltem Draht mit einem Gewicht von etwa einem Kilogramm.
text2 = Nach dem Vorfall 066-2 (siehe Vorfallbericht 066-2) begann SCP-066 ein Verhalten anzuzeigen, das in hohem Mase nicht mit seinen vorherigen Eigenschaften ubereinstimmte.
text3 = SCP-066 zeigt jetzt eine signifikante Mobilitat und wird in Gegenwart eines Menschen abnormale Notizen und Effekte erzeugen, unabhangig davon, ob dieser Mensch mit SCP-066 interagiert oder nicht.

[SCP-079]
image path = 079.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-079 ist ein Exidy Sorcerer Mikrocomputer aus dem Jahr 1978.
text2 = Es ist nicht bekannt, wann SCP-079 darauf aufmerksam wurde, aber es ist bekannt, dass sich die Software bis zu einem Punkt entwickelt hat, an dem ihre Hardware nicht in der Lage sein sollte, sie zu verwalten, nicht einmal im Bereich der Fantasie.
text3 = Er hat den Turing-Test bestanden und ist ziemlich gesprachig, wenn auch mit einem sehr unhoflichen und unausstehlichen Ton. Es zeigt auch einen boswilligen Wunsch zu entkommen.

[SCP-096]
image path = 096.png
align x = right
align y = bottom
disablebackground = true
text1 = SCP-096 ist normalerweise sehr fugsam, mit Drucksensoren in seiner Zelle, die anzeigen, dass es den grosten Teil des Tages damit verbringt, die Wand zu vermessen.
text2 = Wenn jedoch jemand das Gesicht von SCP-096 sieht, sei es direkt, uber eine Videoaufnahme oder sogar ein Foto, tritt er in eine Phase erheblicher emotionaler Entspannung ein.
text3 = Etwa ein bis zwei Minuten nach der ersten Besichtigung beginnt SCP-096 auf die Person zuzulaufen, die sein Gesicht gesehen hat.

[SCP-106]
image path = 106.jpg
align x = right
align y = bottom
text1 = SCP-106 scheint ein humanoides Zeitalter zu sein, mit einem allgemeinen Auftreten fortgeschrittener Zersetzung. Dieser Aspekt kann variieren, aber die Qualitat der "Faulnis" wird in all ihren Formen beobachtet.
text2 = SCP-106 verursacht einen "Korrosionseffekt" auf jedes feste Material, das es beruhrt, wodurch die Materialien einige Sekunden nach dem Kontakt physisch brechen. Dies wird als Rost, Faulnis und Rissbildung von Materialien und die Schaffung einer schwarzen Substanz ahnlich dem Material beobachtet, das SCP-106 bedeckt.
text3 = SCP-106 kann festes Material durchbohren und fangt und totet seine Beute, indem er sie in seine personliche "Taschendimension" zieht.
[SCP-173]
image path = 173.jpg
align x = left
align y = bottom
text1 = SCP-173 besteht aus Beton und Bewehrungsstaben mit Spuren von Aerosolfarbe der Marke Krylon. Er ist am Leben und extrem feindselig.
text2 = Das Objekt kann sich nicht bewegen, wenn es sich in einer direkten Sichtlinie befindet. Die Sichtlinie darf mit SCP-173 zu keinem Zeitpunkt unterbrochen werden. Das Personal, das fur das Betreten des Containers verantwortlich ist, ist dafur verantwortlich, sich vor dem Blinzeln zu alarmieren.

[SCP-205]
image path = 205.jpg
align x = right
align y = bottom
disablebackground = true
text1 = SCP-205 ist ein Paar Projektoren, die in der Fotografie verwendet werden. Das von jeder Lampe emittierte Licht verhalt sich einzigartig gegenuber SCP-205 und durchdringt vollstandig jede nicht-weise Oberflache.
text2 = Wenn das Licht ununterbrochen durch ein Motiv hindurchgeht, ohne Schatten zu werfen, zeigt jede Lampe den Schatten einer nicht identifizierten jungen Frau auf einer weisen, flachen Oberflache, wie der Projektionsflache der 52-Kamera.

[SCP-294]
image path = 294.jpg
align x = center
align y = bottom
disablebackground = true
text1 = Object SCP-294 scheint ein Standard-Kaffeespender zu sein, der einzige bemerkenswerte Unterschied ist ein Eingabe-Touchpanel mit Tasten, die einer englischen QWERTY-Tastatur entsprechen.
text2 = Wenn Sie den Namen einer Flussigkeit mit dem Touchscreen eingeben, legen Sie einen Standard-12-Unzen-Pappbecher und giesen Sie die angegebene Flussigkeit.
text3 = Es wurden 97 erste Tests durchgefuhrt (einschlieslich Anwendungen fur Wasser, Kaffee, Bier und Erfrischungsgetranke, nicht verbrauchbare Flussigkeiten wie Schwefelsaure, Scheibenwaschflussigkeit und Motorol sowie Stoffe, die in der Regel nicht in flussiger Form vorliegen, wie Stickstoff, Eisen und Glas), und alle waren zufriedenstellend.

[SCP-372]
image path = 372.jpg
align x = left
align y = bottom
disablebackground = true
text1 = SCP-372 ist eine Kreatur unbekannten Geschlechts, die vom Kopf bis zum Schwanz etwa 1,80 Meter lang ist und etwa 99,2 Pfund wiegt. Es hat einen langen, dunnen Korper mit acht Paaren schmaler Gliedmasen.
text2 = SCP-372 hat gelernt, die Bewegungen von allem um ihn herum vorherzusagen, und verwendet diese Technik, um sich hinter dem Kopf einer Person oder in einem ihrer blinden Flecken zu verstecken.
text3 = Im Falle eines Lockdowns ist es ratsam, dass alle Mitarbeiter ein kurzes Flackern aus dem Augenwinkel melden.

[SCP-427]
image path = 427.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-427 ist ein kleines kugelformiges Medaillon, das mit poliertem Silber verziert ist. Ornamentale Skulpturen scheinen keinen Zweck zu erfullen.
text2 = SCP-427 wurde erstellt, indem eine SCP-500-Tablette in die Einlasskabine von SCP-914 platziert und "fein" abgestimmt wurde. Es zeigt keine ungewohnliche Aktivitat, wenn fest. Wenn SCP-427 geoffnet und biologischem Gewebe ausgesetzt wird, regeneriert es schnell Zellschaden und ist irgendwie in der Lage, invasive Verbindungen oder Infektionen zu entfernen.
text3 = Eine langfristige Exposition stellt jedoch ein erhebliches Gesundheitsrisiko dar. Da das Medaillon Schaden heilt, optimiert es die naturlichen Systeme des Korpers. Das Class-D-Personal ist dem Gerat insgesamt mehr als eine Stunde lang ausgesetzt und beginnt zu einer formlosen Gewebemasse zu mutieren.
text4 = Die "Fleischhaufen" von Scp-427 sind unglaublich aggressiv und greifen das gesamte Personal an, das sie sehen, mit todlichen Folgen. Sie sind sehr resistent gegen die meisten bekannten Waffen.

[SCP-500]
image path = 500.jpg
align x = right
align y = bottom
text1 = SCP-500 ist eine kleine Plastikbox, die zum Zeitpunkt der Schwarzung siebenundvierzig (47) rote Pillen enthalt.
text2 = Eine Pille, oral eingenommen, heilt das Subjekt effektiv von allen Krankheiten in zwei Stunden, der genauen Zeit, die von der Schwere und Menge der Beschwerden des Subjekts abhangt.
text3 = Trotz umfangreicher Tests sind alle Versuche, den vermeintlichen Wirkstoff von Pillen weiter zu synthetisieren, gescheitert.
[SCP-513]
image path = 513.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-513 ist eine rostige Kuhglocke. Auf seiner Oberflache befinden sich aufgrund der grosen Korrosion keine Markierungen oder Gravuren.
text2 = Etwa eine Stunde nach der Exposition gegenuber dem von SCP-513 erzeugten Larm beginnen die Opfer der Exposition, einen designierten SCP-513-1 zu sehen.
text3 = Alle bisher durchgefuhrten Fragen deuten darauf hin, dass SCP-513-1 ein groser, dunner Humanoid mit ungewohnlich grosen Handen ist.

[SCP-682]
image path = 682.jpg
align x = right
align y = bottom
text1 = SCP-682 ist eine grose, vage reptilienartige Kreatur unbekannter Herkunft. Er scheint einen Hass auf das Leben zu haben, den er wahrend des Lockdowns in verschiedenen Interviews zum Ausdruck brachte.
text2 = SCP-682 wurde immer mit extrem hoher Festigkeit, Geschwindigkeit und Reflexen beobachtet, obwohl die genauen Werte je nach Form variieren. Die Regenerations- und Ausdauerfahigkeit von SCP-682 ist verbluffend, und er wurde gesehen, wie er sich bewegte und mit seinem Korper sprach, der zu 87% zerstort oder verfault war.
text3 = SCP-682 soll sofort zerstort werden.

[SCP-714]
image path = 714.jpg
align x = center
align y = center
disablebackground = true
text1 = Anscheinend nichts weiter als ein gruner Jadering, SCP-714 ist verblasst, der sich ausdehnen und zusammenziehen kann, um perfekt an den Finger eines jeden zu passen, der ihn beruhrt, obwohl dies die am wenigsten wichtige seiner Eigenschaften ist.
text2 = Das Tragen von SCP-714 hat mehrere wichtige Effekte, wie Erschopfung, Ruhe- / Schlafbelastung, langsame Reaktionen und verminderte geistige Leistungsfahigkeit.
text3 = SCP-714-Trager zeigen eine erhohte Toleranz gegenuber verschiedenen Chemikalien und eine ungewohnlich hohe Resistenz gegen memetische und mentale Einflusse.

[SCP-860]
image path = 860.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-860 ist ein dunkelblauer Schlussel.
text2 = In scheinbar zufalligen Zeitintervallen erscheint eine Reihe von Zahlen auf der Tastenklinge. Spater stellte sich heraus, dass es sich um UTM-Koordinaten handelte.
text3 = SCP-860 kann jedes herkommliche Turschloss aktivieren und entriegeln, das einen Schlussel im Datenkoordinatenbereich erfordert.
text4 = Wenn SCP-860 zum Entriegeln und Offnen einer Tur verwendet wird, fuhrt dies nicht zu seinem ublichen Ziel. Stattdessen offnet es sich zu einer kleinen Lichtung im Wald, die spater als SCP-860-1 bezeichnet wurde.

[SCP-895]
image path = 895.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-895 ist ein Chene-Decore-Sarg, der mit dem Leichenschauhaus [DELETES] bedeckt ist.
text2 = SCP-895 verursacht Unterbrechungen der Videouberwachungs- und Photouberwachungsausrustung in einem Umkreis von 50 Metern, ahnlich wie lebhafte und storende Halluzinationen, mit unterschiedlicher Dauer und Regelmasigkeit, entsprechend der Nahe der Kamera mit SCP-895.
text3 = Innerhalb von 5 Metern von SCP-895 konnen die aufgenommenen Bilder bei den meisten Probanden schwere psychische Traumata und Hysterie verursachen.

[SCP-914]
image path = 914.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-914 ist ein groses Uhrmachergerat mit einem Gewicht von mehreren Tonnen und einer Flache von achtzehn Quadratmetern, bestehend aus Schrauben, Riemen, Riemenscheiben, Zahnradern, Federn und anderen Uhrmacherwerken.
text2 = Wenn ein Objekt in der Einlasskabine platziert und der Schlussel wieder zusammengesetzt wird, "verfeinert" SCP-914 das Objekt. Dabei wird kein Strom verschwendet und das Objekt wird gemas den angegebenen Parametern auf der Frontplatte von 914 verfeinert.
text3 = Es darf zu keiner Zeit organisches Material in SCP-914 eingebracht werden.

[SCP-939]
image path = 939.jpg
align x = left
align y = top
disablebackground = true
text1 = SCP-939 sind endotherme Raubtiere, die Herden bilden, die eine Atrophie verschiedener Systeme aufweisen, die der von troglobianischen Organismen ahnelt. SCP-939 ist in aufrechter Position durchschnittlich 2,2 Meter hoch und wiegt durchschnittlich 250 kg, obwohl ihr Gewicht stark variiert.
text2 = Die Hauptmethode von SCP-939, um Beute anzuziehen, ist die Nachahmung menschlicher Sprache in den Stimmen fruherer Opfer, obwohl die Nachahmung anderer Arten und die aktive Nachtjagd dokumentiert wurden.
text3 = Beute stirbt normalerweise durch einen einzigen Biss in den Schadel oder Hals; Es wurden Bisskrafte von mehr als 35 MPa gemessen.


[SCP-966]
image path = 966.jpg
align x = left
align y = bottom
disablebackground = true
text1 = SCP-966 ist nur bei Wellenlangen von etwa 700 nm bis 900 nm sichtbar. Dies gilt fur alle Gewebe von SCP-966, unabhangig von ihrem aktuellen Zustand.
text2 = Ihre Jagdmethoden bestehen darin, einen einzigen Ausbruch einer bisher unbekannten Art von Welle auszusenden, was die Fahigkeit der Kreatur, die in eine der NREM- und REM-Schlafphasen eintreten soll, dauerhaft hemmt. Die Fahigkeit zum Mikroschlaf geht ebenfalls verloren.
text3 = Nachdem SCP-966 seinen Opfern den Schlaf entzogen hat, verfolgt es seine Beute, bis der Mangel an Ruhe sie immobilisiert. Zu diesem Zeitpunkt wird SCP-966 fortfahren, es zu verbrauchen.


[SCP-970]
image path = 970.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-970 ist ein Weltraumphanomen, bei dem sich eine Reihe von Stucken um sich selbst wickelt. In jedem Fall geschieht dies durch eine Reihe von Turen, die in den Wanden erscheinen, alle in einer geraden Linie, so dass es moglich ist, sich vorwarts zu bewegen und sich in der Ausgangsposition zu befinden.
text2 = Das Wechseln von Teilen hat keinen Einfluss auf benachbarte Raume und Etagen. Eine Erklarung fur das Auftreten dieses Phanomens ist noch nicht bekannt.
text3 = Seit der ersten Entdeckung des SCP-970-Phanomens wurden weitere Beispiele dieser Art entdeckt, von denen [DATA REMOVED]% innerhalb von 800 Kilometern von Sektor 19 liegen.
[SCP-1025]
image path = 1025.jpg
align x = right
align y = bottom
text1 = SCP-1025 ist ein Hardcover-Buch mit ca. 1.500 Seiten. Die Titelseite und die Ruckseite tragen den Titel "The Encyclopedia of Common Diseases".
text2 = Es wurde keine andere Kopie eines Buches mit diesem Titel und Herausgeber gefunden, und es existiert kein Verlagshinweis.
text3 = Die Leser des Buches scheinen Symptome jeder Krankheit zu zeigen, die sie lesen. Es kann zwischen _ und __ Stunden dauern, bis sich der Effekt manifestiert.

[SCP-1123]
image path = 1123.jpg
align x = center
align y = center
disablebackground = true 
text1 = SCP-1123 ist ein menschlicher Schadel ohne Unterkiefer und alle Zahne. Auserhalb der frontalen Skala befindet sich eine moderne Khmer-Schrift, die mit menschlichem Blut geschrieben wurde, was Ubersetzt "Erinnern" bedeutet.
text2 = Genetische Tests bestatigen, dass der Schadel und das Blut von derselben Person stammen. Khmer Schrift ist sehr verschwommen und ist fur die meisten Subjekte mehr als 5 Meter unsichtbar.
text3 = Probanden, die weniger als 1 Meter vom Objekt entfernt sind, berichten, dass das Blut frisch ist, als ware es "noch nass", sowie andere abnormale sensorische Phanomene wie Geruche, Gerausche und taktile Reaktionen.

[SCP-1162]
image path = 1162.jpg
align x = center
align y = center
disablebackground = true 
text1 = SCP-1162 ist derzeit ein Loch in einer Wand aus Betonblocken am Standort - [DATA DELETED].
text2 = SCP-1162 ist aktiv, wenn ein fuhlendes Wesen die Locher erreicht, bis zu dem Punkt, an dem seine Finger eine feste taktile Oberflache beruhren, die der aktuellen Position von SCP-1162 ahnelt, und ein Objekt offnet, das klein genug ist, um durch das Loch zu gehen.
text3 = Diese Objekte wurden allgemein als etwas anerkannt, das der Benutzer verloren hat oder nach dem er irgendwann in seinem Leben gesucht hat.

[SCP-1499]
image path = 1499.jpg
align x = right
align y = bottom
disablebackground = true 
text1 = SCP-1499 ist eine GP-5 sowjetische Gasmaske. Ein Versiegelungstest fuhrt fur das vorgeschlagene Objekt durch, dass es seine ursprungliche Funktionalitat beibehalt.
text2 = Die abnormalen Wirkungen von SCP-1499 sind aktiv, wenn ein Mensch SCP-1499 auf den Kopf stellt. Etwa eine Sekunde, nachdem SCP-1499 vollstandig auf dem Kopf des Subjekts fixiert ist, verschwindet das Subjekt aus dem Blickfeld und ist nicht mehr nachweisbar.
text3 = Bei der Verwendung von SCP-1499 berichten die Probanden von einer vollig anderen Umgebung als vor der Verwendung von SCP-1499.

[Der Chaos-Aufstand]
image path = chaos.jpg
align x = left
align y = bottom
disablebackground = true
text1 = Der Aufstand des Chaos ist eine Dissidentengruppe der Foundation, die von einer Rebellenzelle gegrundet wurde, die 1924 mehrere sehr nutzliche SCP erwarb.
text2 = Die Hauptbasis der Operationen des Aufstands ist unbekannt, ebenso wie seine Fuhrer. Diese Organisation steht der Foundation direkt feindlich gegenuber und tritt mehrmals mit dem SCP konfrontiert.
text3 = Das Personal soll auf mogliche Ubergriffe, Terrorversuche und Spione des Aufstands achten und dem Kommando jedes seltsame Verhalten seiner Kollegen melden.

[D-Klasse Mitarbeiter]
image path = classd.jpg
align x = right
align y = bottom
text1 = Class-D-Mitarbeiter sind fur den Umgang mit Keter-Level-Elementen ausgelegt
text2 = Das Personal der D-Klasse wird aus den Reihen der Insassen rekrutiert. Verurteilte Personen werden bevorzugt; In Zeiten der Notigung kann das Protokoll Nr. 12 genehmigt werden, das die Rekrutierung unschuldiger Menschen oder von Personen, die wegen geringfugiger Straftaten inhaftiert sind, erlaubt.
text3 = Alle Mitarbeiter der D-Klasse mussen zu Beginn des Monats entlassen werden, und es muss neues Personal vorhanden sein, das bereit ist, sie zu ersetzen.

