[Die SCP Foundation]
image path = foundationlogo.jpg
align x = left
align y = top
text1 = Die SCP Foundation ist eine Organisation, die sich der Eindammung und Untersuchung von Artefakten und abnormalen Lebensformen widmet.
text2 = "SCP" steht fur "Special Containment Procedures" (und das offizielle Motto der Foundation, "Secure, Contain, Protect"), das sowohl die Ziele als auch die Handlungsweisen der Foundation zusammenfasst.