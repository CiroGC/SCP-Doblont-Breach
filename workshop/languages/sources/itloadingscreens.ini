[Mobile Task Forces]
image path = mtf.jpg
align x = center
align y = center
text1 = Gli MTF sono formati da piccole squadre (da dieci a venti operatori di solito, anche se i gruppi con pi˘ di 50 operatori non sono inauditi) che si specializzano in ruoli specifici o rispondono a situazioni specifiche.
text2 = Mobile Task Force E-11 ("Nine Tailed Fox") Ë una Task Force allenata intensamente a specializzare nella protezione e ricontenimento degli oggetti SCP al Sito-[DATA REDACTED].
text3 = I loro obiettivi includono di gestire le violazioni del contenimento ricontenendo tutte le istanze SCP attive e ostili, salvando il personale sopravvissuto della Fondazione e ponendo fine a qualsiasi membro del personale di Classe D.

[Visori Notturni]
image path = NVG.jpg
align x = right
align y = top
disablebackground = true
text1 = Gli occhiali per la visione notturna di serie vengono forniti alle unit‡ MTF in caso di blackout elettrico.
text2 = Anche gli scienziati sono forniti con i visori notturni, ma si consiglia di concentrarsi sull'evacuazione in caso di blackout.

[SCP-012]
image path = 012.jpg
align x = right
align y = top
disablebackground = true
text1 = SCP-012 Ë stato recuperato dall'archeologo K.M. Sandoval durante lo scavo di una tomba dell'Italia settentrionale. L'oggetto, uno spartito musicale manoscritto intitolato "Sul monte Golgota", sembra essere incompleto.
text2 = L'inchiostro rosso/nero, inizialmente pensato per essere una forma di bacche o inchiostro colorante naturale, Ë stato successivamente scoperto essere sangue umano proveniente da pi˘ soggetti.
text3 = Tanti soggetti del test e' stato consentito l'accesso al punteggio. In ogni caso, i soggetti si sono mutilati per utilizzare il proprio sangue per finire il pezzo, con conseguenti sintomi di psicosi e traumi massivi.

[SCP-035]
image path = 035.jpg
align x = right
align y = top
disablebackground = true
text1 = SCP-035 sembra essere una maschera comica di porcellana bianca, anche se, a volte, si trasformera' in tragedia.
text2 = Quando SCP-035 viene posizionato sul volto di un individuo, un modello alternativo di onde cerebrali di SCP-035 si sovrappone a quello dell'ospite originale, spegnendolo efficacemente e causando la morte cerebrale del soggetto. Il soggetto quindi afferma di essere la coscienza contenuta in SCP-035.
text3 = L'analisi psicologica ha scoperto che SCP-035 possiede una natura altamente manipolativa, capace di forzare cambiamenti improvvisi e profondi allo stato psicologico dell'intervistatore. SCP-035 ha dimostrato di essere altamente sadico, spingendo alcuni a suicidarsi con la sola persuasione linguistica.

[SCP-049]
image path = 049.jpg
align x = left
align y = center
disablebackground = true
text1 = SCP-049 ha una forma umanoide; pero',la Fondazione non Ë attualmente in grado di studiarne il viso e il corpo in modo pi˘ completo, poiche' Ë rivestito in quello che sembra essere l'abito del tradizionale medico della peste dell'Europa del XV-XVI secolo.
text2 = Il tocco di SCP-049 e' invariabilmente letale per gli umani. Dopo il contatto con le mani di SCP-049, la vittima (di seguito denominata SCP-049-2) soffre di [DATI EXPUNGED] e muore in pochi istanti.
text3 = SCP-049 quindi produce una borsa fatta di [DATI EXPUNGED] contenente bisturi, ago, filo e diverse fiale di una sostanza non ancora identificata e inizia a sezionare SCP-049-2, oltre a inserire varie sostanze chimiche nel corpo. 
text4 = Dopo circa 20 minuti, SCP-049 ricucir√† SCP-049-2 e torner√† ad essere docile. Dopo un periodo di pochi minuti, SCP-049-2 riprender√† i segni vitali e sembrer√† rianimarsi.

[SCP-066]
image path = 066.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-066 e' una massa amorfa di filo intrecciato intricato del peso di circa un chilogrammo.
text2 = Dopo l'Incidente 066-2 (vedi Rapporto sull'Incidente 066-2), SCP-066 ha iniziato a mostrare un comportamento altamente incoerente con le sue precedenti proprieta'. 
text3 = SCP-066 ora mostra una mobilit√† significativa e produrr√† note ed effetti anomali in presenza di qualsiasi essere umano, indipendentemente dal fatto che quell'umano interagisca con SCP-066.

[SCP-079]
image path = 079.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-079 e' un microcomputer Exidy Sorcerer costruito nel 1978. 
text2 = Non si sa quando o come SCP-079 sia diventato senziente, ma e' noto che il software si e' evoluto al punto che il suo hardware non dovrebbe essere in grado di gestirlo, anche nel regno della fantasia.
text3 = Ha superato il test di Turing ed e' abbastanza colloquiale, anche se nel tono e' molto scortese e odioso. Mostra anche un desiderio malevolo di fuggire.

[SCP-096]
image path = 096.png
align x = right
align y = bottom
disablebackground = true
text1 = SCP-096 e' normalmente estremamente docile, con sensori di pressione all'interno della sua cella che indicano che trascorre la maggior parte della giornata camminando vicino al muro orientale.
text2 = Tuttavia, quando qualcuno vede il volto di SCP-096, sia esso direttamente, tramite registrazione video o anche una fotografia, entrer√† in una fase di notevole angoscia emotiva.
text3 = Circa uno o due minuti dopo la prima visione, SCP-096 inizier√† a correre verso la persona che ha visto il suo volto.

[SCP-106]
image path = 106.jpg
align x = right
align y = bottom
text1 = SCP-106 sembra essere un umanoide anziano, con un aspetto generale di decomposizione avanzata. Questo aspetto puo' variare, ma la qualita' "marcescente" si osserva in tutte le forme.
text2 = SCP-106 causa un effetto di "corrosione" in tutta la materia solida che tocca, innescando una rottura fisica nei materiali alcuni secondi dopo il contatto. Questo viene osservato come arrugginimento, putrefazione e crepe nei materiali, e la creazione di una sostanza nera, simile al muco, simile al materiale che ricopre SCP-106.
text3 = SCP-106 puo' passare attraverso materiale solido e cattura e uccide la sua preda tirandola in quella che si presume essere la sua personale "dimensione tascabile".

[SCP-173]
image path = 173.jpg
align x = left
align y = bottom
text1 = SCP-173 e' costruito con cemento e armature con tracce di vernice spray di marca Krylon. E' animato ed estremamente ostile.
text2 = L'oggetto non puo' muoversi mentre si trova all'interno di una linea di vista diretta. La linea di vista non deve essere interrotta in nessun momento con SCP-173. Il personale assegnato ad entrare nel contenitore √® istruito ad allertare l'altro prima di lampeggiare.

[SCP-205]
image path = 205.jpg
align x = right
align y = bottom
disablebackground = true
text1 = SCP-205 e' una coppia di lampade a diluvio utilizzate in fotografia. La luce emessa da ogni lampada si comporta in un modo unico SCP-205 e passa completamente attraverso qualsiasi superficie che non e' colorato bianco.
text2 = Se la luce continua ininterrottamente attraverso qualsiasi materia, altrimenti non proietta alcuna ombra, ogni lampada mostrer√† l'ombra di una giovane donna non identificata su qualsiasi superficie bianca piatta, come lo schermo di proiezione nella Cella/Camera 52.

[SCP-294]
image path = 294.jpg
align x = center
align y = bottom
disablebackground = true
text1 = L'articolo SCP-294 sembra essere un distributore automatico di caffe' standard, l'unica differenza evidente Ë un touchpad di ingresso con pulsanti corrispondenti a una tastiera QWERTY inglese.
text2 = Dopo aver inserito il nome di qualsiasi liquido usando il touchpad, una tazza standard da 12 viene posizionata e il liquido indicato viene versato.
text3 = Sono stati eseguiti novantasette test iniziali (comprese le richieste di acqua, caffe', birra e soda, liquidi non consumabili come l'acido solforico, il liquido dei tergicristalli e l'olio motore, cosi' come sostanze che di solito non esistono allo stato liquido, come l'azoto, il ferro e il vetro) e ognuno di essi ha dato un successo.

[SCP-372]
image path = 372.jpg
align x = left
align y = bottom
disablebackground = true
text1 = SCP-372 e' una creatura di genere sconosciuto, lunga circa 6,5 piedi dalla testa alla coda e dal peso di circa 99,2 libbre. Ha un corpo lungo e sottile con otto paia di arti stretti.
text2 = SCP-372 ha imparato a prevedere i movimenti di qualsiasi essere che lo circonda, e usa questa tecnica per nascondersi dietro la testa di una persona che lo cerca, o in uno dei suoi punti ciechi.
text3 = In caso di una breccia di contenimento, si consiglia a tutto il personale di segnalare qualsiasi breve movimento tremolante all'angolo dell'occhio.

[SCP-427]
image path = 427.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-427 e' un piccolo medaglione sferico, ornato di intagli in un materiale d'argento lucido. Gli intagli ornati non sembrano avere alcuna funzione.
text2 = SCP-427 e' stato creato dopo aver messo una pillola di SCP-500 nella cabina di ingresso di SCP-914 e aver usato l'impostazione Fine. Non mostra alcuna attivita' insolita quando √® chiuso. Quando SCP-427 viene aperta ed esposta al tessuto biologico, rigenera rapidamente i danni cellulari e in qualche modo e' in grado di eliminare i composti invasori o le infezioni.
text3 = Tuttavia, l'esposizione a lungo termine produce un rischio significativo per la salute. Mentre il medaglione guarisce i danni, ottimizza i sistemi naturali del corpo. Il personale di classe D esposto al dispositivo per piu' di un'ora in totale ha iniziato a mutare in una massa informe di tessuto.
text4 = Le "Bestie di carne" create da SCP-427 sono incredibilmente aggressive, attaccando qualsiasi personale a vista con risultati letali. Sono altamente resistenti alla maggior parte delle armi conosciute.

[SCP-500]
image path = 500.jpg
align x = right
align y = bottom
text1 = SCP-500 e' un piccolo barattolo di plastica che al momento della scrittura contiene quarantasette (47) pillole rosse.
text2 = Una pillola, quando presa per via orale, cura efficacemente il soggetto di tutte le malattie entro due ore, il tempo esatto dipende dalla gravita' e dalla quantit√† delle condizioni del soggetto.
text3 = Nonostante le prove estese, tutti i tentativi di sintetizzare pi√π di quello che si pensa essere l'ingrediente attivo delle pillole sono stati infruttuosi.

[SCP-513]
image path = 513.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-513 e' un campanaccio irrilevante e arrugginito. Nessun segno o incisione e' visibile sulla sua superficie a causa della grande quantita' di corrosione.
text2 = Circa un'ora dopo l'esposizione a qualsiasi rumore prodotto da SCP-513, le vittime dell'esposizione cominciano a intravedere un'entita' designata come SCP-513-1.
text3 = Tutti gli interrogatori finora indicano che SCP-513-1 e' un umanoide alto ed emaciato con mani anormalmente grandi.

[SCP-682]
image path = 682.jpg
align x = right
align y = bottom
text1 =SCP-682 e' una grande creatura vagamente rettile di origine sconosciuta. Sembra avere un odio per tutta la vita, che e' stato espresso in diverse interviste durante il contenimento.
text2 = SCP-682 e' sempre stato osservato avere forza, velocita' e riflessi estremamente elevati, anche se i livelli esatti variano con la sua forma. Le capacita' rigenerative e la resilienza di SCP-682 sono sbalorditive, ed e' stato visto muoversi e parlare con il suo corpo distrutto o decomposto all'87%..
text3 = SCP-682 deve essere distrutto il pi˘ presto possibile.

[SCP-714]
image path = 714.jpg
align x = center
align y = center
disablebackground = true
text1 = Apparentemente niente piu' di un anello di giada verde, SCP-714 ha dimostrato di essere in grado di espandersi e contrarsi per adattarsi perfettamente al dito di chiunque lo tocchi, anche se questa e' la meno importante delle sue proprieta'. 
text2 = Indossare SCP-714 ha diversi effetti importanti, tra cui l'esaurimento, la costrizione a riposare / dormire, reazioni piu' lente e capacita' mentali ridotte.
text3 = I portatori di SCP-714 mostrano una maggiore tolleranza a varie sostanze chimiche e una resilienza anormalmente elevata alle influenze memetiche e mentali.

[SCP-860]
image path = 860.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-860 e' una chiave blu scuro di forma irrilevante.
text2 = Durante gli intervalli di tempo apparentemente casuali, una serie di numeri apparira' sulla lama della chiave. Si e' poi scoperto che si tratta di coordinate UTM.
text3 = SCP-860 puo' montare e sbloccare qualsiasi serratura tradizionale che richiede una chiave situata nell'area delle coordinate date.
text4 = Quando SCP-860 viene utilizzato per sbloccare e aprire una porta, la porta non conduce alla sua destinazione abituale. Invece, si apre in una piccola radura nella foresta, ulteriormente designata come SCP-860-1.

[SCP-895]
image path = 895.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-895 e' una bara di quercia decorata recuperata dall'obitorio [REDACTED].
text2 = SCP-895 provoca interruzioni nelle apparecchiature di sorveglianza video e fotografiche entro 50 metri simili a vivide e inquietanti allucinazioni con durata e regolarita' variabili corrispondenti alla vicinanza della telecamera a SCP-895. 
text3 = Entro un raggio di 5 metri da SCP-895, i filmati catturati possono causare gravi traumi psicologici e isteria nella maggior parte dei soggetti.

[SCP-914]
image path = 914.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-914 e' un grande dispositivo a orologeria che pesa diverse tonnellate e copre un'area di diciotto metri quadrati, composto da trasmissioni a vite, cinghie, pulegge, ingranaggi, molle e altro materiale a orologeria.
text2 = Quando un oggetto e' posto nella cabina di ingresso e la chiave e' arrotolata, SCP-914 "raffina" l'oggetto. Nessuna energia viene persa nel processo, e l'oggetto viene raffinato in base all'impostazione specificata sul pannello frontale del 914.
text3 = Nessuno oggetto organico deve essere inserito all'interno di SCP-914 in qualsiasi momento.

[SCP-939]
image path = 939.jpg
align x = left
align y = top
disablebackground = true
text1 = Gli SCP-939 sono predatori endotermici, basati sul branco, che mostrano atrofia di vari sistemi simili agli organismi troglobitici. Gli SCP-939 sono alti in media 2,2 metri in posizione eretta e pesano in media 250 kg, anche se il peso e' molto variabile..
text2 = Il metodo principale di SCP-939 per attirare le prede e' l'imitazione del linguaggio umano nelle voci delle vittime precedenti, anche se l'imitazione di altre specie e la caccia notturna attiva sono state documentate.
text3 = La preda viene solitamente uccisa con un singolo morso al cranio o al collo; sono state misurate forze di morso superiori a 35 MP.


[SCP-966]
image path = 966.jpg
align x = left
align y = bottom
disablebackground = true
text1 = SCP-966 sono visibili solo a lunghezze d'onda che vanno da 700 nanometri a circa 900 nanometri. Questo vale per tutti i tessuti di SCP-966, indipendentemente dal loro stato attuale.
text2 = I loro metodi di caccia consistono nell'emettere una singola raffica di un tipo di onda precedentemente sconosciuto, che inibisce permanentemente la capacit√† della creatura colpita di entrare in una qualsiasi delle fasi del sonno NREM e REM. Si perde anche la capacita' di microsonno.
text3 = Dopo aver privato le loro vittime del sonno, SCP-966 pedinano la loro preda fino a quando la mancanza di riposo la rende incapace. A questo punto, SCP-966 procedera' a consumarla.


[SCP-970]
image path = 970.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-970 e' un fenomeno spaziale in cui un insieme di stanze sono in loop su se stesse. In tutti i casi riscontrati, questo avviene per mezzo di una serie di porte che appaiono nelle pareti, tutte in linea retta, in modo tale che e' possibile camminare in avanti e finire nella posizione di partenza.
text2 = L'alterazione delle stanze non influisce sulle stanze e sui piani vicini. Non c'e' ancora una spiegazione conosciuta per la comparsa di questo fenomeno.
text3 = Dalla prima scoperta del fenomeno SCP-970, sono stati scoperti altri esempi del fenomeno, con il [DATA REDACTED]% di questi in un raggio di 800 chilometri dal Settore 19.

[SCP-1025]
image path = 1025.jpg
align x = right
align y = bottom
text1 = SCP-1025 e' un libro con copertina rigida di circa 1500 pagine. La copertina anteriore e la spina dorsale presentano il titolo "L'enciclopedia delle malattie comuni".
text2 = Non sono state trovate altre copie di un libro con quel titolo e quell'editore, e non esiste alcuna registrazione dell'editore.
text3 = I lettori del libro sembrano mostrare i sintomi di qualsiasi malattia di cui leggono. L'effetto puo' richiedere tra _ e __ ore per manifestarsi.

[SCP-1123]
image path = 1123.jpg
align x = center
align y = center
disablebackground = true 
text1 = SCP-1123 e' un cranio umano mancante della mandibola inferiore e di tutti i suoi denti. Attraverso la squama frontale esterna c'e' una moderna scrittura Khmer, scritta con sangue umano, che si traduce come "Ricorda".
text2 = I test genetici confermano che sia il cranio che il sangue sono dello stesso individuo. La scrittura Khmer e' molto sbiadita, e invisibile alla maggior parte dei soggetti oltre i 5 metri di distanza.
text3 = I soggetti a 1 metro o meno dall'oggetto riferiranno che il sangue e' fresco, come se fosse "ancora bagnato", cosi' come altri fenomeni sensoriali anomali, tra cui odori, suoni e risposte tattili.

[SCP-1162]
image path = 1162.jpg
align x = center
align y = center
disablebackground = true 
text1 = SCP-1162 e', attualmente, un buco in un muro di mattoni nel sito-[DATA REDACTED].
text2 = SCP-1162 si attiva quando un essere senziente raggiunge i fori, a quel punto le sue dita toccano una superficie solida simile al tatto alla posizione attuale di SCP-1162, e scoprono un oggetto abbastanza piccolo da passare attraverso il foro.
text3 = Questi oggetti sono stati universalmente riconosciuti come qualcosa che l'utente ha perso, o stava cercando ad un certo punto della sua vita.

[SCP-1499]
image path = 1499.jpg
align x = right
align y = bottom
disablebackground = true 
text1 = SCP-1499 e' una maschera antigas sovietica GP-5. Un test di tenuta effettuato sull'oggetto suggerisce che l'oggetto conserva la sua funzionalita' originale.
text2 = Gli effetti anomali di SCP-1499 si attivano quando un umano mette SCP-1499 sulla propria testa. Circa un secondo dopo che SCP-1499 e' completamente fissato sulla testa del soggetto, il soggetto scompare dalla vista, e non e' piu' rilevabile.
text3 = Dopo aver indossato SCP-1499, i soggetti del test riportano un ambiente completamente diverso da quello in cui si trovavano prima di indossare SCP-1499.

[The Chaos Insurgency]
image path = chaos.jpg
align x = left
align y = bottom
disablebackground = true
text1 = L'Insurrezione del Caos (Chaos Insurgency) Ë un gruppo scissionista della Fondazione, creato da una cellula disonesta che ando' in A.W.O.L. con diversi SCP molto utili nel 1924.
text2 = La base principale delle operazioni dell'Insurrezione e' sconosciuta, cosi' come i suoi leader. Questa organizzazione e' direttamente antagonista della Fondazione, venendo a scontrarsi piu' volte su SCP. 
text3 = Il personale e' tenuto a essere consapevole di possibili incursioni, tentativi di terrorismo e spie dell'insurrezione, e a notificare al comando qualsiasi comportamento strano dei colleghi..

[Class-D Personnel]
image path = classd.jpg
align x = right
align y = bottom
text1 = Il personale di classe D e' il personale designato per gestire gli oggetti di livello Keter.
text2 = Il personale di classe D e' reclutato tra i detenuti delle prigioni. I condannati sono preferiti; in tempi di costrizione, il protocollo 12 puo' essere autorizzato, permettendo il reclutamento di innocenti o persone incarcerate per crimini minori.
text3 = Tutto il personale di classe D deve essere licenziato il primo del mese, e un nuovo personale deve essere pronto a sostituirlo.

