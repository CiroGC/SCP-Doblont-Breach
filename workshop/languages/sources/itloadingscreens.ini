[The SCP Foundation]
image path = foundationlogo.jpg
align x = left
align y = top
text1 = La Fondazione SCP e' un'organizzazione dedicata al contenimento e alla ricerca di artefatti e forme di vita anomale.
text2 = "SCP" sta per "Special Containment Procedures" (e il motto ufficiale della fondazione, "Secure, Contain, Protect.") - che riassume le finalita' e le modalita' dell'azione della Fondazione.
