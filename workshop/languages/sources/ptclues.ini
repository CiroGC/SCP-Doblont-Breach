Se voce for um SCP, podera reproduzir um som clicando com o botao direito do mouse.
Quando voce for um SCP, para tocar em um jogador, voce deve clicar com o botao esquerdo do mouse.
Este mod possui um chat de voz, voce pode falar pressionando a tecla V.
Antes de comecar a jogar, recomendamos que voce altere seu apelido nas configuracoes multijogador.
Recomendamos que voce leia as instrucoes antes de jogar.
Este mod possui armas, voce pode encontra-las no modo "Breach" ou usando o console
Voce pode piscar manualmente pressionando a barra de espaco.
Voce pode combinar certos itens arrastando-os para outros no inventario.
Voce pode pegar itens clicando e pode solta-los arrastando-os para fora do inventario.
Para mirar, voce precisa pressionar o botao direito do mouse.
Voce pode falar com as pessoas no radio.
Ao jogar como SCP-106, permita que outros SCPs matem a vitima para evitar que sobrevivam a sua dimensao de bolso.
Ao jogar como SCP-049-2, permita que o SCP-049 zumbifique a vitima em vez de mata-la voce mesmo. Apenas aja como uma esponja de dano para o seu mestre e bloqueie as fugas.
SCP-966 apenas e visivel atraves de oculos de visao noturna.
SCP-173 nao pode se mover quando em contato direto com os olhos.
O Arsenal na Light Containment Zone pode ser uma otima maneira de destruir qualquer um que se oponha a voce.
Quando voce estiver perto de SCP-939, ele detectara seus passos. Agachar-se ou caminhar diminui as chances de deteccao, mas nao a impede completamente.
SCP-035 pode ser jogado como um humano. O que significa que ele pode pegar itens. Mas como resultado, voce perde a vida.
SCP-860-2 so aparece na floresta (SCP-860-1).