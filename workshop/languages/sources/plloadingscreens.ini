[Mobile Task Forces]
image path = mtf.jpg
align x = center
align y = center
text1 = MTF to małe zespoły (zwykle od dziesięciu do dwudziestu agentów, chociaż są też grupy liczące ponad 50 agentów), które specjalizują się w określonych rolach lub reagują na określone sytuacje.
text2 = Mobilna Formacja Operacyjna E-11 („Dziewięcioogoniasty Lis”) to intensywnie wyszkolona Formacja Operacyjna specjalizująca się w ochronie i ponownym przechowywaniu obiektów SCP przechowywanych w Ośrodku- [USUNIĘTO].
text3 = Ich zadania obejmują radzenie sobie z naruszeniami przechowalni poprzez ponowne zabezpieczanie wszystkich aktywnych, wrogich instancji SCP, ratowanie ocalałego personelu Fundacji i terminowanie wszelkich nieuczciwych pracowników klasy D.

[Night Vision Goggles]
image path = NVG.jpg
align x = right
align y = top
disablebackground = true
text1 = Standardowe gogle noktowizyjne są przekazywane jednostkom MTF w przypadku przerwy w dostawie prądu.
text2 = Naukowcy również je otrzymują, ale radzimy skupić się na ewakuacji w przypadku zaciemnienia.

[SCP-012]
image path = 012.jpg
align x = right
align y = top
disablebackground = true
text1 = SCP-012 został odzyskany przez archeologa K.M. Sandoval podczas wykopalisk grobowca w północnych Włoszech. Obiekt, fragment ręcznie napisanej partytury muzycznej zatytułowany „Na Golgocie”, wydaje się być niekompletny.
text2 = Czerwono-czarny atrament, początkowo uważany za jakąś formę jagodowego lub naturalnego atramentu barwnikowego, później okazał się być ludzką krwią wielu osób.
text3 = Wiele obiektów testowych uzyskało dostęp do wyniku. W każdym przypadku badani okaleczali się, aby dokończyć utwór własną krwią, co skutkowało kolejnymi objawami psychozy i masywnej traumy.

[SCP-035]
image path = 035.jpg
align x = right
align y = top
disablebackground = true
text1 = SCP-035 wygląda na białą porcelanową maskę komediową, chociaż czasami zmienia się w tragedię.
text2 = Kiedy SCP-035 zostaje umieszczony na twarzy osoby, alternatywny wzór fal mózgowych z SCP-035 pokrywa się z pierwotnym nosicielem, skutecznie usuwając go i powodując śmierć mózgu podmiotu. Podmiot następnie twierdzi, że jest świadomością zawartą w SCP-035.
text3 = Analiza psychologiczna wykazała, że ​​SCP-035 posiada wysoce manipulacyjną naturę, zdolną do wymuszenia nagłych i głębokich zmian stanu psychicznego osoby przeprowadzającej wywiad. SCP-035 okazał się wysoce sadystyczny, co skłania niektórych do popełnienia samobójstwa wyłącznie za pomocą perswazji językowej.

[SCP-049]
image path = 049.jpg
align x = left
align y = center
disablebackground = true
text1 = SCP-049 ma wygląd humanoidalny; Jednak Fundacja nie jest obecnie w stanie dokładniej zbadać jego twarzy i ciała, ponieważ jest ona przykryta czymś, co wydaje się być strojem tradycyjnego lekarza dżumy z XV-XVI-wiecznej Europy.
text2 = Dotyk SCP-049 jest niezmiennie śmiertelny dla ludzi. Po kontakcie z ręką (rękami) SCP-049 ofiara (zwana dalej SCP-049-2) cierpi [USUNIĘTO] i umiera w ciągu kilku chwil.
text3 = SCP-049 następnie wytwarza torbę wykonaną z [USUNIĘTO] zawierającą skalpele, igłę, nić i kilka fiolek z niezidentyfikowaną jeszcze substancją i rozpoczyna sekcję SCP-049-2, a także wkłada różne chemikalia do wnętrza ciało.
text4 = Po około 20 minutach SCP-049 przyszyje SCP-049-2 z powrotem i ponownie stanie się potulny. Po kilku minutach SCP-049-2 podsumowuje parametry życiowe i wydaje się, że się ożywia.

[SCP-066]
image path = 066.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-066 to amorficzna masa misternie splecionej nici ważąca około jednego kilograma.
text2 = Po Incydencie 066-2 (patrz Raport z Incydentu 066-2), SCP-066 zaczął wykazywać zachowanie bardzo niezgodne z jego poprzednimi właściwościami.
text3 = SCP-066 wykazuje teraz znaczną mobilność i będzie wytwarzał notatki i anomalne efekty w obecności jakiegokolwiek człowieka, niezależnie od tego, czy ten człowiek wchodzi w interakcję z SCP-066.

[SCP-079]
image path = 079.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-079 to mikrokomputer Exidy Sorcerer zbudowany w 1978 roku.
text2 = Nie wiadomo, kiedy SCP-079 zyskał świadomość, ale wiadomo, że oprogramowanie ewoluowało do tego stopnia, że ​​jego sprzęt nie powinien sobie z nim poradzić, nawet w sferze fantazji.
text3 = Zdał test Turinga i jest dość konwersacyjny, choć w tonie jest bardzo niegrzeczny i nienawistny. Pokazuje również złowrogie pragnienie ucieczki.

[SCP-096]
image path = 096.png
align x = right
align y = bottom
disablebackground = true
text1 = SCP-096 jest zwykle niezwykle posłuszny, a czujniki ciśnienia wewnątrz celi wskazują, że spędza większość dnia chodząc po wschodniej ścianie.
text2 = Jednakże, gdy ktoś obejrzy twarz SCP-096, czy to bezpośrednio, poprzez nagranie wideo, czy nawet zdjęcie, wejdzie on w fazę znacznego stresu emocjonalnego.
text3 = Około jednej do dwóch minut po pierwszym obejrzeniu SCP-096 zacznie biec do osoby, która oglądała jego twarz.

[SCP-106]
image path = 106.jpg
align x = right
align y = bottom
text1 = SCP-106 wydaje się być starszym humanoidem o ogólnym wyglądzie zaawansowanego rozkładu. Ten wygląd może się różnić, ale jakość „gnicia” obserwuje się we wszystkich postaciach.
text2 = SCP-106 powoduje efekt "korozji" we wszystkich ciałach stałych, których dotyka, powodując fizyczny rozpad materiałów kilka sekund po kontakcie. Jest to obserwowane jako rdzewienie, gnicie i pękanie materiałów oraz tworzenie czarnej, podobnej do śluzu substancji, podobnej do powłoki materiału SCP-106.
text3 = SCP-106 może przenikać przez materię stałą i chwytać i zabijać swoją ofiarę, wciągając ją do miejsca, które uważa się za jego osobisty "wymiar kieszonkowy".

[SCP-173]
image path = 173.jpg
align x = left
align y = bottom
text1 = SCP-173 jest zbudowany z betonu i prętów zbrojeniowych ze śladami farby w sprayu marki Krylon. Jest ożywiony i niezwykle wrogi.
text2 = Obiekt nie może się poruszać, gdy znajduje się w bezpośredniej linii wzroku. Linia wzroku nie może zostać przerwana przez SCP-173 w żadnym momencie. Personel wyznaczony do wejścia do kontenera jest poinstruowany, aby ostrzegał się nawzajem przed mrugnięciem.

[SCP-205]
image path = 205.jpg
align x = right
align y = bottom
disablebackground = true
text1 = SCP-205 to para lamp powodziowych używanych w fotografii. Światło emitowane przez każdą lampę zachowuje się w sposób unikalny dla SCP-205 i przechodzi całkowicie przez każdą powierzchnię, która nie jest zabarwiona na biało.
text2 = Jeśli światło jest nieprzerwane przez jakąkolwiek materię, w przeciwnym razie nie rzuca cienia, każda lampa pokaże cień niezidentyfikowanej młodej kobiety na dowolnej płaskiej białej powierzchni, takiej jak ekran projekcyjny w Komorze 52.

[SCP-294]
image path = 294.jpg
align x = center
align y = bottom
disablebackground = true
text1 = Przedmiot SCP-294 wydaje się być standardowym automatem do kawy, jedyną zauważalną różnicą jest wejściowy panel dotykowy z przyciskami odpowiadającymi angielskiej klawiaturze QWERTY.
text2 = Po wprowadzeniu nazwy dowolnego płynu za pomocą panelu dotykowego, umieszcza się standardowy papierowy kubek do picia o pojemności 12 uncji i nalewa wskazany płyn.
text3 = Przeprowadzono dziewięćdziesiąt siedem wstępnych testów (w tym prośby o wodę, kawę, piwo i napoje gazowane, płyny niespożywcze, takie jak kwas siarkowy, płyn do wycieraczek i olej silnikowy, a także substancje, które zwykle nie występują w płynie takich jak azot, żelazo i szkło) i każdy z nich odniósł sukces.

[SCP-372]
image path = 372.jpg
align x = left
align y = bottom
disablebackground = true
text1 = SCP-372 to istota nieznanego rodzaju, o długości około 6,5 stopy od głowy do ogona i wadze około 99,2 funta. Ma długie, cienkie ciało z ośmioma parami wąskich kończyn.
text2 = SCP-372 nauczył się przewidywać ruchy każdej istoty wokół niego i używa tej techniki do chowania się za głową osoby, która go szuka, lub w którymkolwiek z jej martwych punktów.
text3 = W przypadku przełamania zabezpieczeń, wszystkim pracownikom zaleca się zgłaszanie wszelkich krótkich, migotliwych ruchów kącikami oczu.

[SCP-427]
image path = 427.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-427 to mały, kulisty, bogato rzeźbiony medalion wykonany z polerowanego srebra. Ozdobne rzeźby nie wydają się pełnić żadnej funkcji.
text2 = SCP-427 został stworzony po umieszczeniu pigułki SCP-500 w kabinie wejściowej SCP-914 i użyciu ustawienia Fine. Po zamknięciu nie wyświetla żadnej niezwykłej aktywności. Kiedy SCP-427 zostaje otwarty i wystawiony na działanie tkanki biologicznej, szybko regeneruje uszkodzenia komórek i w jakiś sposób jest w stanie usunąć inwazyjne związki lub infekcje.
text3 = Jednak długotrwałe narażenie powoduje poważne zagrożenie dla zdrowia. Ponieważ medalion leczy uszkodzenia, optymalizuje naturalne systemy organizmu. Personel klasy D wystawiony na działanie urządzenia przez ponad godzinę zaczął mutować w bezkształtną masę tkanki.
text4 = "Bestie z ciała" stworzone przez SCP-427 są niezwykle agresywne, atakując każdego, kto jest w zasięgu wzroku, ze śmiertelnymi skutkami. Są bardzo odporne na większość znanej broni.

[SCP-500]
image path = 500.jpg
align x = right
align y = bottom
text1 = SCP-500 to mała plastikowa puszka, która w chwili pisania zawiera czterdzieści siedem (47) czerwonych pigułek.
text2 = Jedna tabletka, przyjmowana doustnie, skutecznie leczy pacjenta ze wszystkich chorób w ciągu dwóch godzin, dokładny czas zależy od ciężkości i nasilenia stanu pacjenta.
text3 = Pomimo szeroko zakrojonych prób, wszystkie próby zsyntetyzowania większej ilości tego, co uważa się za aktywny składnik pigułek, zakończyły się niepowodzeniem.

[SCP-513]
image path = 513.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-513 to zwyczajny, zardzewiały krowi dzwonek. Na jego powierzchni nie są widoczne żadne ślady ani grawery ze względu na dużą ilość korozji.
text2 = Mniej więcej godzinę po ekspozycji na jakikolwiek hałas wytwarzany przez SCP-513, ofiary ekspozycji zaczynają dostrzegać istotę oznaczoną jako SCP-513-1.
text3 = Wszystkie dotychczasowe przesłuchania wskazują, że SCP-513-1 jest wysokim, wychudzonym humanoidem o nienormalnie dużych dłoniach.

[SCP-682]
image path = 682.jpg
align x = right
align y = bottom
text1 = SCP-682 to duże, przypominające gada stworzenie o nieznanym pochodzeniu. Wydaje się, że ma nienawiść do wszelkiego życia, co zostało wyrażone w kilku wywiadach podczas przetrzymywania.
text2 = SCP-682 zawsze posiadał wyjątkowo wysoką siłę, szybkość i refleks, chociaż dokładne poziomy różnią się w zależności od jego formy. Zdolności regeneracyjne i odporność SCP-682 są oszałamiające i zaobserwowano, że porusza się i mówi ze swoim ciałem zniszczonym lub zgniłym w 87%.
text3 = SCP-682 musi zostać zniszczony tak szybko, jak to możliwe.

[SCP-714]
image path = 714.jpg
align x = center
align y = center
disablebackground = true
text1 = Pozornie niczym więcej niż zielonym jadeitowym pierścieniem, wykazano, że SCP-714 jest w stanie rozszerzać się i kurczyć, aby idealnie pasować do palca każdego, kto go dotknie, chociaż jest to najmniej ważna z jego właściwości.
text2 = Noszenie SCP-714 ma kilka głównych skutków, w tym wyczerpanie, przymus odpoczynku/snu, wolniejsze reakcje i zmniejszoną zdolność umysłową.
text3 = Osoby noszące SCP-714 wykazują zwiększoną tolerancję na różne chemikalia i nienormalnie wysoką odporność na wpływy memetyczne i psychiczne.

[SCP-860]
image path = 860.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-860 to ciemnoniebieski klucz o nietypowym kształcie.
text2 = W pozornie losowych odstępach czasu na ostrzu klucza pojawi się seria liczb. Później okazało się, że są to współrzędne UTM.
text3 = SCP-860 może dopasować i otworzyć każdy tradycyjny zamek do drzwi, który wymaga klucza znajdującego się w obszarze o podanych współrzędnych.
text4 = Kiedy SCP-860 jest używany do odblokowywania i otwierania drzwi, drzwi nie prowadzą do swojego zwykłego miejsca przeznaczenia. Zamiast tego otwiera się na małą leśną polanę, dalej oznaczoną jako SCP-860-1.

[SCP-895]
image path = 895.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-895 to ozdobna dębowa trumna odzyskana z [ZMIENIONO] Kostnicy.
text2 = SCP-895 powoduje zakłócenia w sprzęcie nadzoru wideo i fotograficznego w promieniu 50 metrów, podobnie jak żywe, niepokojące halucynacje o zmiennym czasie trwania i regularności odpowiadającej bliskości kamery do SCP-895.
text3 = W promieniu 5 metrów od SCP-895 przechwycony materiał filmowy może wywołać u większości badanych poważny uraz psychiczny i histerię.

[SCP-914]
image path = 914.jpg
align x = center
align y = bottom
disablebackground = true
text1 = SCP-914 to duże urządzenie mechaniczne, ważące kilka ton i zajmujące powierzchnię osiemnastu metrów kwadratowych, składające się z napędów śrubowych, pasów, kół pasowych, kół zębatych, sprężyn i innych mechanizmów.
text2 = Kiedy obiekt zostanie umieszczony w Kabinze Wejściowej, a klucz zostanie nakręcony, SCP-914 "udoskonali" ten obiekt. W procesie nie dochodzi do utraty energii, a obiekt jest dopracowywany w oparciu o ustawienia określone na panelu przednim 914.
text3 = Żadna materia organiczna nie może być wprowadzana do SCP-914 w żadnym momencie.

[SCP-939]
image path = 939.jpg
align x = left
align y = top
disablebackground = true
text1 = SCP-939 to endotermiczne drapieżniki z gromady, które wykazują atrofię różnych systemów podobnych do organizmów troglobicznych. SCP-939 ma średnio 2,2 metra wzrostu, stojąc w pozycji pionowej i waży średnio 250 kg, chociaż waga jest bardzo zmienna.
text2 = Podstawową metodą wabienia ofiar przez SCP-939 jest naśladowanie ludzkiej mowy głosami poprzednich ofiar, chociaż naśladowanie innych gatunków i aktywne nocne polowania zostały udokumentowane.
text3 = Ofiara jest zwykle zabijana jednym ugryzieniem w czaszkę lub szyję; zmierzono siły zgryzu przekraczające 35 MPa.


[SCP-966]
image path = 966.jpg
align x = left
align y = bottom
disablebackground = true
text1 = SCP-966 są widoczne tylko w zakresie długości fal od 700 nm do około 900 nm. Dotyczy to wszystkich tkanek SCP-966, niezależnie od ich aktualnego stanu.
text2 = Ich metody polowania polegają na wyemitowaniu pojedynczego impulsu wcześniej nieznanego typu fali, który trwale hamuje zdolność zaatakowanej istoty do wejścia w którykolwiek z etapów snu NREM i REM. Utracona zostaje również zdolność do mikro snu.
text3 = Po pozbawieniu ofiar snu, SCP-966 będzie tropił zdobycz, dopóki brak odpoczynku jej nie obezwładni. W tym momencie SCP-966 przystąpi do jego konsumpcji.


[SCP-970]
image path = 970.jpg
align x = center
align y = center
disablebackground = true
text1 = SCP-970 to zjawisko przestrzenne, w którym zbiór pomieszczeń jest zapętlony wokół siebie. We wszystkich znalezionych przypadkach jest to za pomocą szeregu drzwi pojawiających się w ścianach, wszystkie w linii prostej, tak że można iść do przodu i znaleźć się w pozycji wyjściowej.
text2 = Zmiana w pokojach nie ma wpływu na sąsiednie pokoje i piętra. Jak dotąd nie ma znanego wyjaśnienia pojawienia się tego zjawiska.
text3 = Od czasu pierwszego odkrycia zjawiska SCP-970 odkryto kolejne takie przykłady tego zjawiska, z [USUNIĘTO]% z nich w promieniu 800 kilometrów w Sektorze 19.

[SCP-1025]
image path = 1025.jpg
align x = right
align y = bottom
text1 = SCP-1025 to książka w twardej oprawie, licząca około 1500 stron. Na przedniej okładce i na grzbiecie znajduje się tytuł „Encyklopedia powszechnych chorób”.
text2 = Nie znaleziono żadnych innych kopii książki o tym tytule i wydawcy, nie ma też wzmianki o wydawcy.
text3 = Czytelnicy książki wydają się mieć objawy każdej choroby, o której czytali. Pojawienie się efektu może zająć od _ do __ godzin.

[SCP-1123]
image path = 1123.jpg
align x = center
align y = center
disablebackground = true 
text1 = SCP-1123 to ludzka czaszka bez dolnej żuchwy i wszystkich zębów. Po drugiej stronie zewnętrznej squama frontalis znajduje się nowoczesny khmerski pismo napisane ludzką krwią, co tłumaczy się jako „Pamiętaj”.
text2 = Testy genetyczne potwierdzają, że zarówno czaszka, jak i krew pochodzą od tej samej osoby. Skrypt khmerski jest mocno wyblakły i niewidoczny dla większości obiektów znajdujących się w odległości większej niż 5 metrów.
text3 = Badani w odległości 1 metra lub mniej od obiektu będą zgłaszać, że krew jest świeża, jakby „nadal mokra”, jak również inne anomalne zjawiska sensoryczne, w tym zapachy, dźwięki i reakcje dotykowe.

[SCP-1162]
image path = 1162.jpg
align x = center
align y = center
disablebackground = true 
text1 = SCP-1162 jest obecnie dziurą w ścianie z pustaków w Ośrodku-[USUNIĘTO].
text2 = SCP-1162 jest aktywowany, gdy czująca istota sięga do dziury, w którym to momencie jej palce dotykają twardej powierzchni podobnej w dotyku do obecnej lokalizacji SCP-1162 i odkrywają przedmiot wystarczająco mały, aby zmieścić się w dziurze.
text3 = Te elementy zostały powszechnie rozpoznane jako coś, co użytkownik zgubił lub szukał w pewnym momencie swojego życia.

[SCP-1499]
image path = 1499.jpg
align x = right
align y = bottom
disablebackground = true 
text1 = SCP-1499 to radziecka maska gazowa GP-5. Test szczelności wykonany na obiekcie sugeruje, że obiekt zachowuje swoją pierwotną funkcjonalność.
text2 = Anomalne efekty SCP-1499 aktywują się, gdy człowiek umieszcza SCP-1499 na swojej głowie. Około jednej sekundy po całkowitym zabezpieczeniu SCP-1499 na głowie podmiotu, podmiot znika z pola widzenia i nie jest już wykrywalny.
text3 = Po założeniu SCP-1499 badani zgłaszają zupełnie inne otoczenie niż przed założeniem SCP-1499.

[The Chaos Insurgency]
image path = chaos.jpg
align x = left
align y = bottom
disablebackground = true
text1 = Rebelia Chaosu to odłamowa grupa Fundacji, stworzona przez zbuntowaną komórkę, która stała się A.W.O.L. z kilkoma bardzo przydatnymi obiektami SCP w 1924 roku.
text2 = Główna baza operacyjna Rebelii jest nieznana, podobnie jak jej przywódcy. Organizacja ta jest bezpośrednio antagonistyczna wobec Fundacji i kilkakrotnie dochodzi do starć o SCP.
text3 = Personel ma być świadomy możliwych nalotów, zamachów terrorystycznych i szpiegów z Rebelii oraz powiadamiać dowództwo o każdym dziwnym zachowaniu innych członków personelu.

[Class-D Personnel]
image path = classd.jpg
align x = right
align y = bottom
text1 = Personel klasy D to wyznaczony personel używany do obsługi obiektów na poziomie Keter.
text2 = Personel klasy D jest rekrutowany spośród więźniów. Preferowane są osoby skazane; w sytuacjach przymusu można zezwolić na Protokół 12, zezwalający na rekrutację niewinnych lub osób osadzonych za mniejsze przestępstwa.
text3 = Wszyscy pracownicy klasy D mają zostać zwolnieni pierwszego dnia miesiąca, a nowy personel musi być gotowy do ich zastąpienia.

